<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">

<title>MODULAR TECH</title>

<link rel="manifest" href="manifest.webmanifest">

<style>
*{
box-sizing:border-box;
}

:root{
--bg:#f4f7fb;
--card:#ffffff;
--dark:#0f172a;
--dark2:#172554;
--primary:#2563eb;
--primary2:#3b82f6;
--text:#172033;
--muted:#64748b;
--border:#e2e8f0;
--danger:#dc2626;
--success:#16a34a;
--warning:#f59e0b;
--sidebar:260px;
}

html,
body{
margin:0;
padding:0;
min-height:100%;
font-family:Arial,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--text);
}

body{
overflow-x:hidden;
}

button,
input,
textarea,
select{
font-family:inherit;
}

button{
cursor:pointer;
border:0;
}

.hidden{
display:none!important;
}


/* =====================================================
LOGIN
===================================================== */

#loginPage{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:
radial-gradient(circle at top right,#2563eb55,transparent 35%),
linear-gradient(135deg,#020617,#0f172a 55%,#172554);
}

.login-box{
width:100%;
max-width:430px;
background:rgba(255,255,255,.97);
border-radius:28px;
padding:34px;
box-shadow:0 30px 80px #0008;
}

.login-brand{
display:flex;
flex-direction:column;
align-items:center;
gap:12px;
margin-bottom:28px;
}

.login-logo{
width:78px;
height:78px;
object-fit:contain;
border-radius:20px;
}

.login-logo-fallback{
width:78px;
height:78px;
display:flex;
align-items:center;
justify-content:center;
border-radius:20px;
background:linear-gradient(135deg,#2563eb,#172554);
color:white;
font-size:22px;
font-weight:900;
}

.login-title{
font-size:27px;
font-weight:900;
letter-spacing:.5px;
}

.login-sub{
color:var(--muted);
margin-top:-6px;
}

label{
display:block;
font-size:14px;
font-weight:800;
margin-bottom:6px;
}

input,
textarea,
select{
width:100%;
padding:13px 14px;
border:1px solid var(--border);
border-radius:12px;
background:#fff;
font-size:15px;
outline:none;
transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
border-color:var(--primary);
box-shadow:0 0 0 4px #2563eb18;
}

.login-btn{
width:100%;
padding:14px;
border-radius:13px;
background:linear-gradient(135deg,var(--primary),var(--primary2));
color:#fff;
font-size:16px;
font-weight:900;
box-shadow:0 8px 20px #2563eb44;
}

.login-btn:hover{
transform:translateY(-1px);
}

.login-error{
display:none;
background:#fee2e2;
color:#991b1b;
padding:13px;
border-radius:12px;
margin-bottom:16px;
font-weight:800;
}


/* =====================================================
APP LAYOUT
===================================================== */

#app{
min-height:100vh;
}

.sidebar{
position:fixed;
top:0;
bottom:0;
width:var(--sidebar);
background:
linear-gradient(180deg,#0f172a,#111c35 60%,#172554);
color:#fff;
padding:20px 14px;
z-index:50;
display:flex;
flex-direction:column;
transition:.25s;
}

html[dir="rtl"] .sidebar{
right:0;
left:auto;
}

html[dir="ltr"] .sidebar{
left:0;
right:auto;
}

.brand{
display:flex;
align-items:center;
gap:12px;
padding:8px 10px 22px;
border-bottom:1px solid #ffffff18;
margin-bottom:16px;
}

.brand img{
width:46px;
height:46px;
object-fit:contain;
border-radius:13px;
background:#fff;
padding:4px;
}

.brand-fallback{
width:46px;
height:46px;
border-radius:13px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#2563eb,#60a5fa);
font-size:14px;
font-weight:900;
}

.brand-text strong{
display:block;
font-size:17px;
}

.brand-text span{
font-size:11px;
opacity:.65;
}

.sidebar-user{
padding:13px;
border-radius:15px;
background:#ffffff0d;
margin-bottom:16px;
}

.sidebar-user-name{
font-weight:900;
font-size:14px;
}

.sidebar-user-role{
font-size:11px;
opacity:.65;
margin-top:4px;
}

.nav{
display:flex;
flex-direction:column;
gap:6px;
}

.nav button{
width:100%;
display:flex;
align-items:center;
gap:11px;
padding:12px 13px;
border-radius:12px;
background:transparent;
color:#dbeafe;
font-weight:800;
text-align:start;
transition:.2s;
}

.nav button:hover{
background:#ffffff10;
}

.nav button.active{
background:linear-gradient(135deg,#2563eb,#3b82f6);
color:#fff;
box-shadow:0 7px 18px #2563eb30;
}

.nav-icon{
width:25px;
text-align:center;
font-size:18px;
}

.sidebar-bottom{
margin-top:auto;
border-top:1px solid #ffffff18;
padding-top:14px;
}

.language-btn{
width:100%;
display:flex;
justify-content:center;
align-items:center;
gap:8px;
padding:11px;
border-radius:12px;
background:#ffffff12;
color:#fff;
font-weight:900;
margin-bottom:8px;
}

.language-btn:hover{
background:#ffffff20;
}

.logout{
width:100%;
padding:11px;
border-radius:12px;
background:#dc2626;
color:#fff;
font-weight:900;
}

.main{
min-height:100vh;
padding:24px;
}

html[dir="rtl"] .main{
margin-right:var(--sidebar);
}

html[dir="ltr"] .main{
margin-left:var(--sidebar);
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
margin-bottom:24px;
}

.page-title h1{
margin:0;
font-size:28px;
font-weight:900;
}

.page-title p{
margin:6px 0 0;
color:var(--muted);
font-size:13px;
}

.mobile-menu{
display:none;
padding:11px 13px;
border-radius:12px;
background:#fff;
box-shadow:0 2px 12px #0000000d;
font-size:20px;
}

.topbar-actions{
display:flex;
align-items:center;
gap:9px;
}

.top-language{
display:flex;
align-items:center;
gap:7px;
padding:10px 13px;
border-radius:12px;
background:#fff;
font-weight:900;
box-shadow:0 2px 12px #0000000d;
}

.top-user{
padding:10px 13px;
border-radius:12px;
background:#fff;
font-size:13px;
font-weight:800;
box-shadow:0 2px 12px #0000000d;
}


/* =====================================================
SECTIONS
===================================================== */

.section{
display:block;
}

.section.hidden{
display:none;
}


/* =====================================================
STATS
===================================================== */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
margin-bottom:20px;
}

.stat{
background:#fff;
border:1px solid #edf1f6;
border-radius:18px;
padding:20px;
box-shadow:0 5px 20px #00000008;
position:relative;
overflow:hidden;
}

.stat:after{
content:"";
position:absolute;
width:70px;
height:70px;
border-radius:50%;
background:#2563eb0c;
top:-25px;
left:-20px;
}

.stat-title{
font-size:13px;
color:var(--muted);
font-weight:700;
}

.stat-number{
font-size:32px;
font-weight:900;
margin-top:8px;
}


/* =====================================================
PANELS
===================================================== */

.panel{
background:#fff;
border-radius:20px;
padding:20px;
margin-bottom:20px;
box-shadow:0 5px 20px #00000008;
border:1px solid #edf1f6;
}

.panel-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:18px;
}

.panel h2{
margin:0;
font-size:20px;
font-weight:900;
}


/* =====================================================
BUTTONS
===================================================== */

.primary{
background:linear-gradient(135deg,#2563eb,#3b82f6);
color:#fff;
}

.success{
background:#16a34a;
color:#fff;
}

.danger{
background:#dc2626;
color:#fff;
}

.secondary{
background:#e8eef6;
color:#172033;
}

.btn{
padding:10px 14px;
border-radius:11px;
font-weight:900;
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:13px;
}


/* =====================================================
SEARCH
===================================================== */

.search-box{
position:relative;
margin-bottom:18px;
}

.search-box input{
padding-right:42px;
}

html[dir="ltr"] .search-box input{
padding-right:14px;
padding-left:42px;
}

.search-icon{
position:absolute;
top:13px;
right:14px;
font-size:18px;
}

html[dir="ltr"] .search-icon{
right:auto;
left:14px;
}


/* =====================================================
ORDERS
===================================================== */

.order-list{
display:grid;
gap:13px;
}

.order{
border:1px solid var(--border);
border-radius:16px;
padding:16px;
background:#fff;
transition:.2s;
}

.order:hover{
box-shadow:0 8px 25px #0000000a;
transform:translateY(-1px);
}

.order.urgent{
border:2px solid #ef4444;
background:#fff8f8;
}

.order-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.order-number{
font-size:18px;
font-weight:900;
}

.customer{
margin-top:6px;
font-weight:800;
}

.info{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
margin-top:13px;
}

.info-box{
background:#f6f8fb;
border-radius:11px;
padding:10px;
font-size:12px;
color:var(--muted);
}

.info-box b{
display:block;
margin-top:5px;
font-size:13px;
color:var(--text);
}

.badge{
display:inline-flex;
align-items:center;
padding:6px 10px;
border-radius:999px;
background:#eaf2ff;
color:#1556a8;
font-size:12px;
font-weight:900;
}

.overdue{
background:#ffe5e5;
color:#a61b1b;
}


/* =====================================================
STAGES
===================================================== */

.stage-card{
background:#fff;
border:1px solid var(--border);
border-radius:17px;
padding:16px;
}

.stage-card+.stage-card{
margin-top:12px;
}


/* =====================================================
USERS
===================================================== */

.user-card{
background:#fff;
border:1px solid var(--border);
border-radius:16px;
padding:16px;
}

.user-card+.user-card{
margin-top:10px;
}


/* =====================================================
MODALS
===================================================== */

.modal{
position:fixed;
inset:0;
background:#02061799;
display:flex;
align-items:center;
justify-content:center;
padding:15px;
z-index:100;
backdrop-filter:blur(5px);
}

.modal-box{
background:#fff;
width:100%;
max-width:620px;
max-height:90vh;
overflow:auto;
border-radius:22px;
padding:22px;
box-shadow:0 25px 80px #0008;
}

.modal-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:16px;
}

.modal-head h2{
margin:0;
}

.close{
background:#edf2f7;
font-size:22px;
padding:5px 12px;
border-radius:10px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.check{
display:flex;
align-items:center;
gap:8px;
font-weight:900;
margin:5px 0 12px;
}

.check input{
width:auto;
margin:0;
}


/* =====================================================
EMPTY / MESSAGE
===================================================== */

.empty{
text-align:center;
padding:35px 15px;
color:var(--muted);
font-weight:700;
}

.message{
position:fixed;
bottom:20px;
left:20px;
right:20px;
max-width:500px;
margin:auto;
padding:14px;
border-radius:14px;
background:#16a34a;
color:#fff;
font-weight:900;
text-align:center;
display:none;
z-index:200;
box-shadow:0 10px 30px #0003;
}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:900px){

:root{
--sidebar:0px;
}

.sidebar{
width:270px;
transform:translateX(110%);
}

html[dir="ltr"] .sidebar{
transform:translateX(-110%);
}

.sidebar.open{
transform:translateX(0)!important;
}

.main,
html[dir="rtl"] .main,
html[dir="ltr"] .main{
margin:0;
padding:14px;
}

.mobile-menu{
display:block;
}

.stats{
grid-template-columns:repeat(2,1fr);
}

.top-user{
display:none;
}

}

@media(max-width:600px){

.topbar{
align-items:flex-start;
}

.page-title h1{
font-size:22px;
}

.page-title p{
font-size:11px;
}

.stats{
gap:9px;
}

.stat{
padding:14px;
border-radius:15px;
}

.stat-number{
font-size:25px;
}

.panel{
padding:14px;
border-radius:17px;
}

.info{
grid-template-columns:1fr 1fr;
}

.row{
grid-template-columns:1fr;
}

.login-box{
padding:25px 20px;
}

.top-language{
padding:9px 10px;
}

.order-head{
align-items:flex-start;
}

}

@media(max-width:380px){

.stats{
grid-template-columns:1fr;
}

.info{
grid-template-columns:1fr;
}

}
</style>
</head>

"https://bvrfrcmblwzuqprjknam.supabase.co";

/* =====================================================
SUPABASE REQUEST
===================================================== */

async function request(path,method="GET",body=null){

const token=
localStorage.getItem(
"supabase_access_token"
);

const authToken=
token || SUPABASE_KEY;

const options={
method,
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+authToken,
"Content-Type":"application/json",
"Prefer":"return=representation"
}
};

if(body!==null){
options.body=JSON.stringify(body);
}

const response=
await fetch(
SUPABASE_URL+path,
options
);

const text=
await response.text();

let data;

try{
data=text?JSON.parse(text):null;
}catch{
data=text;
}

if(!response.ok){

let message;

if(typeof data==="object" && data){

message=
data.message ||
data.error_description ||
data.error ||
data.hint ||
JSON.stringify(data);

}else{

message=
data ||
("HTTP "+response.status);

}

throw new Error(message);
}

return data;
}


/* =====================================================
AUTH
===================================================== */

async function auth(path,body){

const response=
await fetch(
SUPABASE_URL+
"/auth/v1/"+
path,
{
method:"POST",
headers:{
"apikey":SUPABASE_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify(body)
}
);

const text=
await response.text();

let data;

try{
data=text?JSON.parse(text):{};
}catch{
data={message:text};
}

if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
data.message ||
"فشل تسجيل الدخول"
);
}

return data;
}

/* =====================================================
ESCAPE
===================================================== */

function esc(value){

return String(value??"")
.replace(
/[&<>"']/g,
function(char){
return{
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char];
}
);
}

/* =====================================================
LOGIN
===================================================== */

async function login(){

const username=
document.getElementById(
"loginUsername"
).value.trim();

const password=
document.getElementById(
"loginPassword"
).value;

const errorBox=
document.getElementById(
"loginError"
);

errorBox.style.display="none";

if(!username || !password){

errorBox.textContent=
currentLanguage==="he"
?
"יש להזין שם משתמש וסיסמה"
:
"يرجى إدخال اسم المستخدم وكلمة المرور";

errorBox.style.display="block";

return;
}

try{

const result=
await request(
"/rest/v1/rpc/get_login_email",
"POST",
{
p_username:username
}
);

let email=null;

if(typeof result==="string"){

email=result;

}else if(Array.isArray(result)){

email=
result[0]?.email ||
result[0] ||
null;

}else if(result){

email=
result.email ||
result;

}

if(!email){

throw new Error(
currentLanguage==="he"
?
"שם המשתמש אינו קיים או שהחשבון אינו פעיל"
:
"اسم المستخدم غير موجود أو الحساب غير فعال"
);

}


const session=
await auth(
"token?grant_type=password",
{
email,
password
}
);

if(!session.access_token){

throw new Error(
"لم يتم الحصول على جلسة دخول من Auth"
);

}

localStorage.setItem(
"supabase_access_token",
session.access_token
);

if(session.refresh_token){

localStorage.setItem(
"supabase_refresh_token",
session.refresh_token
);

}


await loadProfile(
session.user.id,
session.user.email,
username
);


showApp();

await loadOrders();

if(role==="المدير"){
await loadUsers();
}

msg(
currentLanguage==="he"
?
"✅ ההתחברות הצליחה"
:
"✅ تم تسجيل الدخول"
);

}catch(error){

console.error(
"LOGIN ERROR:",
error
);

errorBox.textContent=
"❌ "+error.message;

errorBox.style.display="block";

}

}

===================================================== */

order.due &&

order.stage < stages.length-1
);

if(role!=="المدير"){

alert(
currentLanguage==="he"
?
"אין לך הרשאה לשמור הזמנה"
:
"ليس لديك صلاحية حفظ الطلبية"
);

return;
}

const id=
document.getElementById(
"editId"
).value;

const payload={

order_number:
document.getElementById(
"orderNum"
).value.trim(),

customer_name:
document.getElementById(
"customer"
).value.trim(),

phone:
document.getElementById(
"phone"
).value.trim(),

due_date:
document.getElementById(
"due"
).value,

notes:
document.getElementById(
"notes"
).value.trim(),

urgent:
document.getElementById(
"urgent"
).checked,

updated_at:
new Date().toISOString()

};

try{

if(id){

await request(
"/rest/v1/orders?id=eq."+
encodeURIComponent(id),
"PATCH",
payload
);

msg(
currentLanguage==="he"
?
"✅ ההזמנה עודכנה"
:
"✅ تم تعديل الطلبية"
);

}else{

payload.stage=0;

delete payload.updated_at;

await request(
"/rest/v1/orders",
"POST",
payload
);

msg(
currentLanguage==="he"
?
"✅ ההזמנה נשמרה"
:
"✅ تم حفظ الطلبية"
);

}

closeModal();

await loadOrders();

}catch(error){

alert(
"❌ "+
(
currentLanguage==="he"
?
"נכשל בשמירה"
:
"فشل الحفظ"
)+
"\n\n"+
error.message
);

}

});


/* =====================================================
EDIT ORDER
===================================================== */

function editOrder(id){

if(role!=="المدير"){

alert(
currentLanguage==="he"
?
"אין לך הרשאת עריכה"
:
"ليس لديك صلاحية التعديل"
);

return;
}

const order=
orders
.map(norm)
.find(
x=>String(x.id)===
String(id)
);

if(!order){
return;
}

document.getElementById(
"modalTitle"
).textContent=
currentLanguage==="he"
?
"✏️ עריכת הזמנה #"+order.num
:
"✏️ تعديل الطلبية #"+order.num;

document.getElementById(
"editId"
).value=order.id;

document.getElementById(
"orderNum"
).value=order.num;

document.getElementById(
"customer"
).value=order.customer;

document.getElementById(
"phone"
).value=order.phone;

document.getElementById(
"due"
).value=order.due;

document.getElementById(
"notes"
).value=order.notes;

document.getElementById(
"urgent"
).checked=order.urgent;

document
.getElementById("orderModal")
.classList
.remove("hidden");

}


/* =====================================================
DELETE ORDER
===================================================== */

async function deleteOrder(id){

if(role!=="المدير"){
return;
}

const order=
orders
.map(norm)
.find(
x=>String(x.id)===
String(id)
);

if(!order){
return;
}

const confirmText=
currentLanguage==="he"
?
"האם למחוק את ההזמנה #"+order.num+"?"
:
"هل تريد حذف الطلبية #"+order.num+" ؟";

if(!confirm(confirmText)){
return;
}

try{

await request(
"/rest/v1/orders?id=eq."+
encodeURIComponent(id),
"DELETE"
);

await loadOrders();

msg(
currentLanguage==="he"
?
"🗑️ ההזמנה נמחקה"
:
"🗑️ تم حذف الطلبية"
);

}catch(error){

alert(
"❌ "+error.message
);

}

}


/* =====================================================
NEXT STAGE
===================================================== */

async function nextStage(id){

const order=
orders
.map(norm)
.find(
x=>String(x.id)===
String(id)
);

if(!order){
return;
}

const next=
order.stage+1;

if(next>=stages.length){
return;
}

if(
role!=="المدير" &&
stages[next][1]!==role
){

alert(
currentLanguage==="he"
?
"אין לך הרשאה לשלב זה"
:
"هذه المرحلة ليست ضمن صلاحيات قسمك"
);

return;
}

try{

await request(
"/rest/v1/orders?id=eq."+
encodeURIComponent(id),
"PATCH",
{
stage:next,
updated_at:
new Date().toISOString()
}
);

await loadOrders();

msg(
currentLanguage==="he"
?
"✅ סטטוס ההזמנה עודכן"
:
"✅ تم تحديث المرحلة"
);

}catch(error){

alert(
"❌ "+error.message
);

}

}


/* =====================================================
DETAILS
===================================================== */

function details(id){

const order=
orders
.map(norm)
.find(
x=>String(x.id)===
String(id)
);

if(!order){
return;
}

const he=
currentLanguage==="he";

alert(

(he?"📋 הזמנה #":"📋 الطلبية #")+
order.num+

"\n\n"+
(he?"לקוח: ":"الزبون: ")+
order.customer+

"\n"+
(he?"טלפון: ":"الهاتف: ")+
(order.phone||"-")+

"\n"+
(he?"תאריך מסירה: ":"موعد التسليم: ")+
(order.due||"-")+

"\n"+
(he?"סטטוס: ":"الحالة: ")+
(
stages[order.stage]?.[0]||
"-"
)+

"\n"+
(he?"מחלקה: ":"القسم: ")+
(
stages[order.stage]?.[1]||
"-"
)+

"\n"+
(he?"הערות: ":"الملاحظات: ")+
(
order.notes||"-"
)

);

}


/* =====================================================
ORDER HTML
===================================================== */

function orderHtml(order){

const he=
currentLanguage==="he";

const stage=
stages[order.stage];

const stageName=
stage?.[0] ||
(he?"בטיפול":"في العمل");

const department=
stage?.[1] ||
"-";

let nextButton="";

if(order.stage<stages.length-1){

const nextDepartment=
stages[order.stage+1][1];

nextButton=`

<button
class="btn primary"
onclick="nextStage('${order.id}')"
>
➡️ ${he?"בוצע ":"تم "}${esc(nextDepartment)}
</button>

`;

}else{

nextButton=`

<span class="badge">
${he?"✅ הושלם":"✅ مكتملة"}
</span>

`;

}

return `

<div class="order ${order.urgent?"urgent":""}">

<div class="order-head">

<div>

<div class="order-number">

${order.urgent?"⭐ ":""}

#${esc(order.num)}

</div>

<div class="customer">
${esc(order.customer)}
</div>

</div>

<span class="badge ${
overdue(order)
?
"overdue"
:
""
}">

${
overdue(order)
?
(he?"באיחור":"متأخرة")
:
esc(stageName)
}

</span>

</div>


<div class="info">

<div class="info-box">

📞 ${he?"טלפון":"الهاتف"}

<b>
${esc(order.phone||"-")}
</b>

</div>


<div class="info-box">

📅 ${he?"מסירה":"التسليم"}

<b>
${esc(order.due||"-")}
</b>

</div>


<div class="info-box">

🏭 ${he?"מחלקה":"القسم"}

<b>
${esc(department)}
</b>

</div>

</div>


<div class="actions">

<button
class="btn secondary"
onclick="details('${order.id}')"
>
📋 ${he?"פרטים":"التفاصيل"}
</button>


${
role==="المدير"
?
`

<button
class="btn success"
onclick="editOrder('${order.id}')"
>
✏️ ${he?"עריכה":"تعديل"}
</button>

<button
class="btn danger"
onclick="deleteOrder('${order.id}')"
>
🗑️ ${he?"מחיקה":"حذف"}
</button>

`
:
""
}


${nextButton}

</div>

</div>

`;

}


/* =====================================================
DASHBOARD
===================================================== */

function renderDashboard(){

const list=
orders.map(norm);

document.getElementById(
"totalCount"
).textContent=
list.length;

document.getElementById(
"activeCount"
).textContent=
list.filter(
o=>o.stage<stages.length-1
).length;

document.getElementById(
"urgentCount"
).textContent=
list.filter(
o=>o.urgent
).length;

document.getElementById(
"overdueCount"
).textContent=
list.filter(overdue).length;

document.getElementById(
"latestOrders"
).innerHTML=
list
.slice(0,5)
.map(orderHtml)
.join("")
||
`
<div class="empty">
${currentLanguage==="he"
?"אין הזמנות עדיין"
:"لا توجد طلبيات حتى الآن"}
</div>
`;

}


/* =====================================================
SEARCH
===================================================== */

function renderOrders(){

const q=
(
document.getElementById(
"search"
)?.value||
""
)
.trim()
.toLowerCase();

const list=
orders
.map(norm)
.filter(order=>

[
order.num,
order.customer,
order.phone
]
.join(" ")
.toLowerCase()
.includes(q)

);

const box=
document.getElementById(
"ordersList"
);

if(!box){
return;
}

box.innerHTML=
list
.map(orderHtml)
.join("")
||
`
<div class="empty">
${
currentLanguage==="he"
?
"לא נמצאו הזמנות תואמות"
:
"لا توجد طلبيات مطابقة"
}
</div>
`;

}


/* =====================================================
STAGES
===================================================== */

function renderStages(){

const list=
orders.map(norm);

const he=
currentLanguage==="he";

document.getElementById(
"stageList"
).innerHTML=

stages
.map(
(stage,index)=>{

const stageOrders=
list.filter(
order=>order.stage===index
);

return `

<div class="stage-card">

<div class="order-head">

<div>

<div class="order-number">
${esc(
he
?
translateStage(stage[0])
:
stage[0]
)}
</div>

<div class="customer">

${
he
?
"מחלקה אחראית: "
:
"القسم المسؤول: "
}

${esc(
translateRole(stage[1])
)}

</div>

</div>

<span class="badge">
${stageOrders.length}
${he?"הזמנות":"طلبية"}
</span>

</div>


${
stageOrders.length
?
stageOrders
.map(orderHtml)
.join("")
:
`
<div class="empty">

he
?
"ไม่มี הזמנות בשלב זה"

"لا توجد طلبيات في هذه المرحلة"
}
</div>
`
}

</div>

`;

}
)
.join("");

}


/* =====================================================
TRANSLATE STAGES / ROLES
===================================================== */

function translateStage(value){

const map={

"في العمل":"בטיפול",
"تم القص":"בוצע חיתוך",
"تم الكنت":"בוצע קנטים",
"تم CNC":"בוצע CNC",
"تم التركيب":"בוצעה הרכבה",
"تم الدهان":"בוצע צבע",
"تم التغليف":"בוצעה אריזה",
"تم التحميل":"בוצעה העמסה",
"تم التسليم":"נמסר"

};

return map[value] || value;

}


function translateRole(value){

const map={

"المدير":"מנהל",
"القص":"חיתוך",
"الكنت":"קנטים",
"CNC":"CNC",
"التركيب":"הרכבה",
"الدهان":"צבע",
"التغليف":"אריזה",
"التحميل":"העמסה",
"التسليم":"מסירה"

};

return map[value] || value;

}


/* =====================================================
LOAD USERS
===================================================== */

async function loadUsers(){

if(role!=="المدير"){
return;
}

const usersList=
document.getElementById(
"usersList"
);

if(!usersList){
return;
}

usersList.innerHTML=
`
<div class="empty">
⏳ ${
currentLanguage==="he"
?
"טוען משתמשים..."
:
"جاري تحميل المستخدمين..."
}
</div>
`;

try{

const users=
await request(
"/rest/v1/rpc/get_all_profiles",
"POST",
{}
);

if(!Array.isArray(users)){

throw new Error(
"البيانات المستلمة من get_all_profiles غير صحيحة"
);

}

if(users.length===0){

usersList.innerHTML=
`
<div class="empty">
${
currentLanguage==="he"
?
"אין משתמשים במערכת"
:
"لا يوجد مستخدمون في النظام"
}
</div>
`;

}

const he=
currentLanguage==="he";

usersList.innerHTML=
users
.map(
user=>{

const isActive=
user.active!==false;

return `

<div class="user-card">

<div class="order-head">

<div>

<div class="order-number">

${esc(
user.full_name||
user.username||
(he?"ללא שם":"بدون اسم")
)}

</div>

<div class="customer">

@${esc(
user.username||
"-"
)}

</div>

</div>

<span class="badge">

${esc(
he
?
translateRole(user.role||"-")
:
user.role||"-"
)}

</span>

</div>


<div class="info">

<div class="info-box">

👤 ${
he
?
"שם משתמש"
:
"اسم المستخدم"
}

<b>
${esc(user.username||"-")}
</b>

</div>


<div class="info-box">

🏢 ${
he
?
"מחלקה"
:
"القسم"
}

<b>
${esc(
he
?
translateRole(user.role||"-")
:
user.role||"-"
)}
</b>

</div>


<div class="info-box">

📧 ${
he
?
"דואר אלקטרוני"
:
"البريد الإلكتروني"
}

<b>
${esc(user.email||"-")}
</b>

</div>

</div>


<div class="actions">

<span class="badge ${
isActive
?
""
:
"overdue"
}">

${
isActive
?
(
he
?
"🟢 חשבון פעיל"
:
"🟢 الحساب فعال"

(
he
?
"🔴 חשבון מושבת"

)

</div>

</div>

)
.join("");

}catch(error){

"LOAD USERS ERROR:",
error

usersList.innerHTML=
`
<div class="empty">
❌ ${
currentLanguage==="he"
?
"לא ניתן לטעון משתמשים"
:
"تعذر تحميل قائمة المستخدمين"
}

<small>
${esc(error.message)}
</small>

USER MODAL
===================================================== */

function openUserModal(){

if(role!=="المدير"){

alert(
currentLanguage==="he"
?
"עמוד זה מיועד למנהל בלבד"
:
"هذه الصفحة للمدير فقط"
);

return;
}

document
.getElementById("userForm")
.reset();

document.getElementById(
"newActive"
).checked=true;

document
.getElementById("userModal")
.classList
.remove("hidden");

}


function closeUserModal(){

document
.getElementById("userModal")
.classList
.add("hidden");

}


/* =====================================================
CREATE USER
===================================================== */

document
.getElementById("userForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

if(role!=="المدير"){
return;
}

const username=
document.getElementById(
"newUsername"
).value.trim();

const fullName=
document.getElementById(
"newFullName"
).value.trim();

const email=
document.getElementById(
"newEmail"
).value.trim();

const password=
document.getElementById(
"newPassword"
).value;

const userRole=
document.getElementById(
"newRole"
).value;

const active=
document.getElementById(
"newActive"
).checked;

if(
!username ||
!fullName ||
!email ||
!password
){

alert(
currentLanguage==="he"
?
"יש למלא את כל השדות"
:
"يرجى تعبئة جميع البيانات"
);

return;
}

if(password.length<6){

alert(
currentLanguage==="he"
?
"הסיסמה חייבת להכיל לפחות 6 תווים"
:
"كلمة المرور يجب أن تكون 6 أحرف على الأقل"
);

return;
}

try{

const token=
localStorage.getItem(
"supabase_access_token"
);

if(!token){

throw new Error(
currentLanguage==="he"
?
"החיבור פג, יש להתחבר מחדש"
:
"انتهت جلسة الدخول، سجل الدخول من جديد"
);

}


const response=
await fetch(
CREATE_USER_FUNCTION,
{
method:"POST",
headers:{
"Content-Type":
"application/json",
"Authorization":
"Bearer "+token,
"apikey":
SUPABASE_KEY
},
body:JSON.stringify({

username,
full_name:fullName,
email,
password,
role:userRole,
active

})
}
);

const text=
await response.text();

let data;

try{
data=text?JSON.parse(text):{};
}catch{
data={message:text};
}

if(!response.ok){

throw new Error(
data.message||
data.error||
data.error_description||
"فشل إنشاء المستخدم"
);

}


closeUserModal();

document
.getElementById("userForm")
.reset();

document.getElementById(
"newActive"
).checked=true;

await loadUsers();

msg(
currentLanguage==="he"
?
"✅ המשתמש נוצר בהצלחה"
:
"✅ تم إنشاء المستخدم بنجاح"
);

}catch(error){

console.error(
"CREATE USER ERROR:",
error
);

let message=
error.message||
"فشل إنشاء المستخدم";

if(
message
.toLowerCase()
.includes(
"already registered"
)
){

message=
currentLanguage==="he"
?
"הדואר האלקטרוני כבר בשימוש"
:
"هذا البريد الإلكتروني مستخدم مسبقًا في Auth";

}

alert(
"❌ "+
(
currentLanguage==="he"
?
"לא ניתן ליצור משתמש"
:
"لم يتم إنشاء المستخدم"
)+
"\n\n"+
message
);

}

});
