<script>

/* =====================================================
   CONFIG
===================================================== */

const SUPABASE_URL =
"https://bvrfrcmblwzuqprjknam.supabase.co";

const SUPABASE_KEY =
"sb_publishable_vVXVJGcWpoPvPEH_bfm23Q_dZ5eXvmE";

const CREATE_USER_FUNCTION =
"https://bvrfrcmblwzuqprjknam.supabase.co/functions/v1/bright-task";


let orders = [];

let currentProfile = null;

let role = "";


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function request(path,method="GET",body=null){

const token =
localStorage.getItem("supabase_access_token");

const headers = {

"apikey":SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":"return=representation"
};

if(token){

headers["Authorization"] =
"Bearer "+token;

}else{

headers["Authorization"] =
"Bearer "+SUPABASE_KEY;

}

const options = {
method:method,
headers:headers
};

if(body !== null){

options.body =
JSON.stringify(body);

}

const response =
await fetch(
SUPABASE_URL+path,
options
);

const text =
await response.text();

let data = null;

try{

data =
text
?
JSON.parse(text)
:
null;

}catch{

data=text;

}

if(!response.ok){

let message =
"HTTP "+response.status;

if(data){

if(typeof data==="string"){

message=data;

}else{

message =
data.message ||
data.error_description ||
data.error ||
data.hint ||
JSON.stringify(data);

}

}

throw new Error(message);

}

return data;

}


/* =====================================================
   AUTH
===================================================== */

async function auth(path,body){

const response =
await fetch(
SUPABASE_URL+
"/auth/v1/"+
path,
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Content-Type":
"application/json"
},

body:
JSON.stringify(body)
}
);

const text =
await response.text();

let data;

try{

data =
text
?
JSON.parse(text)
:
{};

}catch{

data={
message:text
};

}

if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
data.message ||
data.error ||
"فشل تسجيل الدخول"
);

}

return data;

}


/* =====================================================
   MESSAGE
===================================================== */

function msg(text){

const box =
document.getElementById("message");

box.textContent=text;

box.style.display="block";

setTimeout(
()=>{
box.style.display="none";
},
3000
);

}


/* =====================================================
   ESCAPE
===================================================== */

function esc(value){

return String(value ?? "")
.replace(
/[&<>"']/g,
function(char){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char];

}
);

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

const username =
document.getElementById(
"loginUsername"
).value.trim();

const password =
document.getElementById(
"loginPassword"
).value;

const errorBox =
document.getElementById(
"loginError"
);

errorBox.style.display="none";

if(!username || !password){

errorBox.textContent =
"يرجى إدخال اسم المستخدم وكلمة المرور";

errorBox.style.display="block";

return;

}

try{

/*
 الحصول على البريد من username
*/

const result =
await request(
"/rest/v1/rpc/get_login_email",
"POST",
{
p_username:username
}
);

let email=null;

if(typeof result==="string"){

email=result;

}else if(Array.isArray(result)){

email =
result[0]?.email ||
result[0] ||
null;

}else if(result){

email =
result.email ||
result;

}

if(!email){

throw new Error(
"اسم المستخدم غير موجود أو الحساب غير فعال"
);

}


/*
 تسجيل الدخول في Supabase Auth
*/

const session =
await auth(
"token?grant_type=password",
{
email:email,
password:password
}
);


/*
 حفظ الجلسة
*/

localStorage.setItem(
"supabase_access_token",
session.access_token
);

if(session.refresh_token){

localStorage.setItem(
"supabase_refresh_token",
session.refresh_token
);

}


/*
 تحميل profile بالطريقة الجديدة
*/

await loadProfile();


/*
 إظهار التطبيق
*/

showApp();

await loadOrders();

if(role==="المدير"){

await loadUsers();

}

msg("✅ تم تسجيل الدخول");

}catch(error){

console.error(
"LOGIN ERROR:",
error
);

errorBox.textContent =
"❌ "+error.message;

errorBox.style.display="block";

}

}


/* =====================================================
   LOAD PROFILE
   الحل الجذري
===================================================== */

async function loadProfile(){

currentProfile=null;

role="";


try{

/*
 مهم جدًا:

لا نبحث عن profiles بواسطة ID
من JavaScript.

Supabase نفسه يستخدم auth.uid()
داخل الدالة get_my_profile.
*/

const result =
await request(
"/rest/v1/rpc/get_my_profile",
"POST",
{}
);


/*
 RPC قد يرجع JSON object
أو string
*/

if(!result){

throw new Error(
"لم يتم العثور على ملف المستخدم في profiles"
);

}

if(typeof result==="string"){

try{

currentProfile =
JSON.parse(result);

}catch{

throw new Error(
"استجابة ملف المستخدم غير صحيحة"
);

}

}else{

currentProfile=result;

}


/*
 التأكد النهائي
*/

if(
!currentProfile ||
!currentProfile.id
){

throw new Error(
"لم يتم العثور على ملف المستخدم في profiles"
);

}


/*
 الحساب فعال؟
*/

if(
currentProfile.active===false
){

throw new Error(
"هذا الحساب غير فعال"
);

}


/*
 حفظ الصلاحية
*/

role =
currentProfile.role ||
"";


/*
 عرض اسم المستخدم
*/

const currentUser =
document.getElementById(
"currentUser"
);

if(currentUser){

currentUser.textContent =
(
currentProfile.full_name ||
currentProfile.username ||
"المستخدم"
)+
" — "+
(
role ||
"بدون قسم"
);

}

console.log(
"PROFILE LOADED:",
currentProfile
);

}catch(error){

console.error(
"LOAD PROFILE ERROR:",
error
);

throw new Error(
"لم يتم العثور على ملف المستخدم في profiles"
);

}

}


/* =====================================================
   SHOW APP
===================================================== */

function showApp(){

document
.getElementById("loginPage")
.classList
.add("hidden");

document
.getElementById("app")
.classList
.remove("hidden");

applyPermissions();

}


/* =====================================================
   CHECK SESSION
===================================================== */

async function checkSession(){

const token =
localStorage.getItem(
"supabase_access_token"
);

if(!token){

return;

}

try{

/*
 التأكد من أن Auth session صالحة
*/

const user =
await request(
"/auth/v1/user"
);


/*
 profile يتم جلبه بواسطة auth.uid()
*/

await loadProfile();

showApp();

await loadOrders();

if(role==="المدير"){

await loadUsers();

}

}catch(error){

console.warn(
"SESSION ERROR:",
error
);

localStorage.removeItem(
"supabase_access_token"
);

localStorage.removeItem(
"supabase_refresh_token"
);

}

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

localStorage.removeItem(
"supabase_access_token"
);

localStorage.removeItem(
"supabase_refresh_token"
);

location.reload();

}


/* =====================================================
   PERMISSIONS
===================================================== */

function applyPermissions(){

const isAdmin =
role==="المدير";

document
.getElementById("usersNav")
.classList
.toggle(
"hidden",
!isAdmin
);

document
.querySelectorAll(".admin-only")
.forEach(button=>{

button.classList.toggle(
"hidden",
!isAdmin
);

});

}


/* =====================================================
   STAGES
===================================================== */

const stages=[

["في العمل","المدير"],
["تم القص","القص"],
["تم الكنت","الكنت"],
["تم CNC","CNC"],
["تم التركيب","التركيب"],
["تم الدهان","الدهان"],
["تم التغليف","التغليف"],
["تم التحميل","التحميل"],
["تم التسليم","التسليم"]

];


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

try{

const data =
await request(
"/rest/v1/orders"+
"?select=id,order_number,customer_name,phone,due_date,notes,urgent,stage,created_at,updated_at"+

/* =====================================================
   NORMALIZE
===================================================== */

function norm(order){

return{

id:order.id,

num:
order.order_number ||
"",

customer:
order.customer_name ||
"",

phone:
order.phone ||
"",

due:
order.due_date ||
"",

notes:
order.notes ||
"",

urgent:
!!order.urgent,

stage:
Number(order.stage || 0)

};

}


/* =====================================================
   OVERDUE
===================================================== */

function overdue(order){

return(
order.due &&
new Date(
order.due+"T23:59:59"
) <
new Date() &&
order.stage <
stages.length-1
);

}

/* =====================================================
   NEXT STAGE
===================================================== */

async function nextStage(id){

const order =
orders
.map(norm)
.find(
x=>String(x.id)===
String(id)
);

if(!order){

return;

}

const next =
order.stage+1;

if(next>=stages.length){

return;

}

if(
role!=="المدير" &&
stages[next][1]!==role
){

alert(
"هذه المرحلة ليست ضمن صلاحيات قسمك"
);

return;

}

try{

await request(
"/rest/v1/orders?id=eq."+
encodeURIComponent(id),
"PATCH",
{
stage:next,
updated_at:
new Date().toISOString()
}
);

await loadOrders();

msg(
"✅ تم تحديث المرحلة"
);

}catch(error){

alert(
"❌ فشل تحديث المرحلة\n\n"+
error.message
);

}

}

===================================================== */

const q =
(
document.getElementById(
"search"
)?.value||
""
)
.trim()
.toLowerCase();

orders
.map(norm)
.filter(order=>

order.customer,
order.phone
]
.join(" ")
.toLowerCase()
.includes(q)

);

"ordersList"
).innerHTML =
list
.map(orderHtml)
.join("")
||
"<div class='empty'>"+

/* =====================================================
   CREATE USER
   BRIGHT-TASK
===================================================== */

document
.getElementById("userForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

if(role!=="المدير"){

alert(
"هذه العملية للمدير فقط"
);

return;

}

const username =
document.getElementById(
"newUsername"
).value.trim();

const fullName =
document.getElementById(
"newFullName"
).value.trim();

const email =
document.getElementById(
"newEmail"
).value.trim();

const password =
document.getElementById(
"newPassword"
).value;

const userRole =
document.getElementById(
"newRole"
).value;

const active =
document.getElementById(
"newActive"
).checked;

if(
!username ||
!fullName ||
!email ||
!password
){

alert(
"يرجى تعبئة جميع البيانات"
);

return;

}

if(password.length<6){

alert(
"كلمة المرور يجب أن تكون 6 أحرف على الأقل"
);

return;

}

try{

const token =
localStorage.getItem(
"supabase_access_token"
);

if(!token){

throw new Error(
"انتهت جلسة الدخول، سجل الدخول من جديد"
);

}

const response =
await fetch(
CREATE_USER_FUNCTION,
{

method:"POST",

headers:{
"Content-Type":
"application/json",

"Authorization":
"Bearer "+token,

"apikey":
SUPABASE_KEY
},

body:
JSON.stringify({

username:
username,

full_name:
fullName,

email:
email,

password:
password,

role:
userRole,

active:
active

})

}
);

const text =
await response.text();

let data;

try{

data =
text
?
JSON.parse(text)
:
{};

}catch{

data={
message:text
};

}

if(!response.ok){

throw new Error(

data.message ||
data.error ||
data.error_description ||
"فشل إنشاء المستخدم"

);

}

closeUserModal();

document
.getElementById("userForm")
.reset();

document.getElementById(
"newActive"
).checked=true;

await loadUsers();

msg(
"✅ تم إنشاء المستخدم بنجاح"
);

}catch(error){

console.error(
"CREATE USER ERROR:",
error
);

let message =
error.message ||
"فشل إنشاء المستخدم";

if(
message
.toLowerCase()
.includes(
"already registered"
)
){

message =
"هذا البريد الإلكتروني مستخدم مسبقًا في Auth";

}

alert(
"❌ لم يتم إنشاء المستخدم\n\n"+
message
);

}

});
