<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://bvrfrcmblwzuqprjknam.supabase.co";

const SUPABASE_KEY =
"sb_publishable_vVXVJGcWpoPvPEH_bfm23Q_dZ5eXvmE";


let orders = [];
let currentProfile = null;
let currentAuthUser = null;
let role = "";


/* =====================================================
   HELPERS
===================================================== */

function esc(value){

return String(value ?? "")
.replace(/[&<>"']/g,function(char){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char];

});

}


function showMessage(text){

const box =
document.getElementById("message");

box.textContent = text;
box.style.display = "block";

setTimeout(function(){
box.style.display = "none";
},3000);

}


function showLoginError(text){

const box =
document.getElementById("loginError");

box.textContent = "❌ " + text;
box.style.display = "block";

}


function clearLoginError(){

const box =
document.getElementById("loginError");

box.textContent = "";
box.style.display = "none";

}


/* =====================================================
   SUPABASE REST
===================================================== */

async function request(path,method="GET",body=null){

const token =
localStorage.getItem("supabase_access_token");

if(!token){

throw new Error(
"لا توجد جلسة دخول صالحة."
);

}

const options = {

method:method,

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+token,
"Content-Type":"application/json",
"Prefer":"return=representation"
}

};

if(body !== null){

options.body =
JSON.stringify(body);

}

const response =
await fetch(
SUPABASE_URL + path,
options
);

const text =
await response.text();

let data = null;

try{

data =
text
?
JSON.parse(text)
:
null;

}catch{

data = text;

}

if(!response.ok){

throw new Error(

typeof data === "object"

?

(
data.message ||
data.error_description ||
data.error ||
data.hint ||
JSON.stringify(data)
)

:

data ||
("HTTP "+response.status)

);

}

return data;

}


/* =====================================================
   AUTH
===================================================== */

async function authLogin(email,password){

const response =
await fetch(
SUPABASE_URL+
"/auth/v1/token?grant_type=password",
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Content-Type":"application/json"
},

body:JSON.stringify({
email:email,
password:password
})
}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
data.message ||
"بيانات الدخول غير صحيحة"
);

}

return data;

}


/* =====================================================
   GET USERNAME EMAIL
===================================================== */

async function getLoginEmail(username){

/*
هذا RPC يجب أن يكون موجودًا في Supabase.
وظيفته تحويل اسم المستخدم إلى البريد.
*/

const response =
await fetch(
SUPABASE_URL+
"/rest/v1/rpc/get_login_email",
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Content-Type":"application/json"
},

body:JSON.stringify({
p_username:username
})
}
);

const text =
await response.text();

let data;

try{

data =
text
?
JSON.parse(text)
:
null;

}catch{

data=text;

}

if(!response.ok){

throw new Error(
data?.message ||
data?.hint ||
"تعذر العثور على البريد المرتبط باسم المستخدم"
);

}

if(typeof data === "string"){

return data;

}

if(Array.isArray(data)){

if(!data.length){
return null;
}

return data[0]?.email ||
data[0] ||
null;

}

return data?.email || null;

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

clearLoginError();

const username =
document
.getElementById("loginUsername")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value;

const button =
document.getElementById("loginButton");

if(!username || !password){

showLoginError(
"يرجى إدخال اسم المستخدم وكلمة المرور"
);

return;

}

button.disabled = true;
button.textContent = "⏳ جارٍ تسجيل الدخول...";

try{

/*
1. الحصول على البريد من اسم المستخدم
*/

const email =
await getLoginEmail(username);

if(!email){

throw new Error(
"اسم المستخدم غير موجود أو غير فعال."
);

}


/*
2. تسجيل الدخول في Supabase Auth
*/

const session =
await authLogin(
email,
password
);

if(!session.access_token){

throw new Error(
"لم يتم الحصول على جلسة دخول من Supabase."
);

}


/*
3. حفظ الجلسة
*/

localStorage.setItem(
"supabase_access_token",
session.access_token
);

if(session.refresh_token){

localStorage.setItem(
"supabase_refresh_token",
session.refresh_token
);
}


/*
4. الحصول على Auth User
*/

const authUser =
session.user;

if(!authUser?.id){

throw new Error(
"لم يتم الحصول على معرف حساب Auth."
);

}

currentAuthUser =
authUser;


/*
5. تحميل profiles باستخدام Auth ID
*/

await loadProfile(
authUser.id,
authUser.email
);


/*
6. إظهار التطبيق
*/

showApp();

await loadOrders();

showMessage(
"✅ تم تسجيل الدخول بنجاح"
);

}catch(error){

console.error("LOGIN ERROR:",error);

localStorage.removeItem(
"supabase_access_token"
);

localStorage.removeItem(
"supabase_refresh_token"
);

showLoginError(
error.message
);

}finally{

button.disabled = false;
button.textContent = "🔐 تسجيل الدخول";

}

}


/* =====================================================
   LOAD AUTH USER FROM SESSION
===================================================== */

async function getCurrentAuthUser(){

const token =
localStorage.getItem(
"supabase_access_token"
);

if(!token){

return null;

}

const response =
await fetch(
SUPABASE_URL+
"/auth/v1/user",
{
method:"GET",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+token
}
}
);

if(!response.ok){

return null;

}

return await response.json();

}

"Bearer "+

data =
text

JSON.parse(text)

null;

data=null;

console.log(
"PROFILE RESPONSE:",
data
);

if(!response.ok){

throw new Error(
"فشل قراءة profiles: "+
(
data?.message ||
data?.hint ||
JSON.stringify(data)
)
);

if(
!Array.isArray(data) ||
data.length === 0
){

/*
محاولة ثانية بالبريد
*/

if(email){

const emailUrl =
"/rest/v1/profiles"+
"?select=id,username,full_name,role,active,email"+
"&email=eq."+
encodeURIComponent(email)+
"&limit=1";

const emailResponse =
await fetch(
SUPABASE_URL+emailUrl,
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+
localStorage.getItem(
"supabase_access_token"
)
}
}
);

const emailData =
await emailResponse.json();

if(
Array.isArray(emailData) &&
emailData.length
){

currentProfile =
emailData[0];

}else{

throw new Error(
"لم يتم العثور على ملف المستخدم. Auth ID = "+
userId+
". يجب أن يكون profiles.id مساويًا لهذا الرقم."
);

}

}else{

throw new Error(
"لم يتم العثور على ملف المستخدم. Auth ID = "+
userId+
". يجب أن يكون profiles.id مساويًا لهذا الرقم."
);

}

}else{

currentProfile =
data[0];

}


if(
String(currentProfile.id)
!==
String(userId)
){

throw new Error(
"تم العثور على Profile ولكن الـ ID غير مطابق لحساب Auth."
);

}


if(
currentProfile.active === false
){

throw new Error(
"هذا الحساب غير فعال."
);

}

role =
currentProfile.role ||
"";

document.getElementById(
"currentUser"
).textContent =

(
currentProfile.full_name ||
currentProfile.username ||
"المستخدم"
)

+
" — "
+
role;

console.log(
"PROFILE LOADED:",
currentProfile
);

}

===================================================== */

"</div>";

/* =====================================================
   NORMALIZE ORDER
===================================================== */

function norm(order){

return{

id:order.id,

num:
order.order_number || "",

customer:
order.customer_name || "",

phone:
order.phone || "",

due:
order.due_date || "",

notes:
order.notes || "",

urgent:
!!order.urgent,

stage:
Number(order.stage || 0)

};

}


/* =====================================================
   OVERDUE
===================================================== */

function overdue(order){

return(
order.due &&
new Date(
order.due+"T23:59:59"
) < new Date() &&
order.stage < stages.length-1
);

}

   SECTION

function showSection(id,button){

}

/* =====================================================
   SAVE ORDER
===================================================== */

document
.getElementById("orderForm")
.addEventListener(
"submit",
async function(event){

event.preventDefault();

if(role !== "المدير"){

alert(
"ليس لديك صلاحية حفظ الطلبية."
);

return;

}

const id =
document.getElementById(
"editId"
).value;

const payload = {

order_number:
document.getElementById(
"orderNum"
).value.trim(),

customer_name:
document.getElementById(
"customer"
).value.trim(),

phone:
document.getElementById(
"phone"
).value.trim(),

due_date:
document.getElementById(
"due"
).value,

notes:
document.getElementById(
"notes"
).value.trim(),

urgent:
document.getElementById(
"urgent"
).checked,

updated_at:
new Date().toISOString()

};

try{

if(id){

await request(
"/rest/v1/orders?id=eq."+
encodeURIComponent(id),
"PATCH",
payload
);

showMessage(
"✅ تم تعديل الطلبية"
);

}else{

payload.stage=0;

delete payload.updated_at;

await request(
"/rest/v1/orders",
"POST",
payload
);

showMessage(
"✅ تم حفظ الطلبية"
);

}

closeModal();

await loadOrders();

}catch(error){

console.error(error);

alert(
"❌ فشل الحفظ\n\n"+
error.message
);

}

});


/* =====================================================
   EDIT ORDER
===================================================== */

function editOrder(id){

if(role !== "المدير"){

alert(
"ليس لديك صلاحية التعديل."
);

}

const order =

"orderNum"

order.num;

"customer"
).value =
order.customer;

document.getElementById(
"phone"
).value =
order.phone;

document.getElementById(
"due"
).value =
order.due;

document.getElementById(
"notes"
).value =
order.notes;

"urgent"
).checked =

document
.getElementById("orderModal")

.remove("hidden");

}


/* =====================================================
   DELETE ORDER
===================================================== */

async function deleteOrder(id){

if(role !== "المدير"){

alert(
"ليس لديك صلاحية الحذف."
);

return;

}

const order =
orders
.map(norm)
.find(
item =>
String(item.id) === String(id)
);

if(
!order ||
!confirm(
"هل تريد حذف الطلبية #"+
order.num+
" ؟"
)
){

return;

}

try{

await request(
"/rest/v1/orders?id=eq."+
encodeURIComponent(id),
"DELETE"
);

await loadOrders();

showMessage(
"🗑️ تم حذف الطلبية"
);

}catch(error){

alert(
"❌ فشل الحذف\n\n"+
error.message
);

}

}


/* =====================================================
   NEXT STAGE
===================================================== */

async function nextStage(id){

const order =
orders
.map(norm)
.find(
item =>
String(item.id) === String(id)
);

if(!order){

return;

}

const next =
order.stage + 1;

if(next >= stages.length){

return;

}

if(
role !== "المدير" &&
stages[next][1] !== role
){

alert(
"هذه المرحلة ليست ضمن صلاحيات قسمك."
);

return;

}

try{

await request(
"/rest/v1/orders?id=eq."+
encodeURIComponent(id),
"PATCH",
{
stage:next,
updated_at:
new Date().toISOString()
}
);

await loadOrders();

showMessage(
"✅ تم تحديث المرحلة"
);

}catch(error){

alert(
"❌ فشل تحديث المرحلة\n\n"+
error.message
);

}

}


/* =====================================================
   DETAILS
===================================================== */

function details(id){

const order =
orders
.map(norm)
.find(
item =>
String(item.id) === String(id)
);

if(!order){

return;

}

alert(

"📋 الطلبية #"+
order.num+

"\n\n"+
"الزبون: "+
order.customer+

"\n"+
"الهاتف: "+
(order.phone || "-")+

"\n"+
"موعد التسليم: "+
(order.due || "-")+

"\n"+
"الحالة: "+
(stages[order.stage]?.[0] || "-")+

"\n"+
"القسم: "+
(stages[order.stage]?.[1] || "-")+

"\n"+
"الملاحظات: "+
(order.notes || "-")

);

}


/* =====================================================
   ORDER HTML
===================================================== */

function orderHtml(order){

const isOverdue =
overdue(order);

return `

<div class="order ${order.urgent ? "urgent" : ""}">

<div class="order-head">

<div>

<div class="order-number">

${order.urgent ? "⭐ " : ""}

#${esc(order.num)}

</div>

<div class="customer">

${esc(order.customer)}

</div>

</div>

<span class="badge ${isOverdue ? "overdue" : ""}">

${
isOverdue
?
"متأخرة"
:
esc(
stages[order.stage]?.[0] ||
"في العمل"
)
}

</span>

</div>


<div class="info">

<div class="info-box">

📞 الهاتف

<b>
${esc(order.phone || "-")}
</b>

</div>


<div class="info-box">

📅 التسليم

<b>
${esc(order.due || "-")}
</b>

</div>


<div class="info-box">

🏭 القسم

<b>
${esc(
stages[order.stage]?.[1] || "-"
)}
</b>

</div>

</div>


<div class="actions">

<button
class="secondary"
onclick="details('${order.id}')"
>
📋 التفاصيل
</button>


${
role === "المدير"

?

`

<button
class="success"
onclick="editOrder('${order.id}')"
>
✏️ تعديل
</button>

<button
class="danger"
onclick="deleteOrder('${order.id}')"
>
🗑️ حذف
</button>

`

:
""
}


${
order.stage < stages.length-1

?

`

<button
class="primary"
onclick="nextStage('${order.id}')"
>
➡️ تم ${esc(
stages[order.stage+1]?.[1] || ""
)}
</button>

`

:

`

<span class="badge">
✅ مكتملة
</span>

`

}

</div>

</div>

`;

}


/* =====================================================
   DASHBOARD
===================================================== */

function renderDashboard(){

const list =
orders.map(norm);

document.getElementById(
"totalCount"
).textContent =
list.length;

document.getElementById(
"activeCount"
).textContent =

list.filter(
order =>
order.stage <
stages.length-1
).length;

document.getElementById(
"urgentCount"
).textContent =

list.filter(
order =>
order.urgent
).length;

document.getElementById(
"overdueCount"
).textContent =

list.filter(
overdue
).length;

document.getElementById(
"latestOrders"
).innerHTML =

list
.slice(0,5)
.map(orderHtml)
.join("")

||

"<div class='empty'>لا توجد طلبيات حتى الآن</div>";

}


/* =====================================================
   SEARCH
===================================================== */

function renderOrders(){

const input =
document.getElementById("search");

const q =
(
input?.value ||
""
)
.trim()
.toLowerCase();

const list =
orders
.map(norm)
.filter(
order =>

[
order.num,
order.customer,
order.phone
]
.join(" ")
.toLowerCase()
.includes(q)
);

document.getElementById(
"ordersList"
).innerHTML =

list
.map(orderHtml)
.join("")

||

"<div class='empty'>لا توجد طلبيات مطابقة.</div>";

}


/* =====================================================
   STAGES
===================================================== */

function renderStages(){

const list =
orders.map(norm);

document.getElementById(
"stageList"
).innerHTML =

stages
.map(
(stage,index)=>{

const stageOrders =
list.filter(
order =>
order.stage === index
);

return `

<div class="stage-card">

<div class="order-head">

<div>

<div class="order-number">

${stage[0]}

</div>

<div class="customer">

القسم المسؤول:
${stage[1]}

</div>

</div>

<span class="badge">

${stageOrders.length}
طلبية

</span>

</div>


${
stageOrders.length

?

stageOrders
.map(orderHtml)
.join("")

:

`

<div class="empty">
لا توجد طلبيات في هذه المرحلة
</div>

`

}

</div>

`;

}
)
.join("");

}
