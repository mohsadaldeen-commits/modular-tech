<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MODULAR TECH</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#172033
}

header{
background:#102a43;
color:white;
padding:18px 24px;
display:flex;
justify-content:space-between;
align-items:center
}

header b{font-size:22px}

.wrap{
max-width:1200px;
margin:24px auto;
padding:0 16px
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:14px
}

.card,.panel{
background:white;
border-radius:16px;
padding:18px;
box-shadow:0 4px 18px #0000000d
}

.card strong{
font-size:28px;
display:block;
margin-top:8px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-top:18px
}

@media(max-width:760px){
.grid{grid-template-columns:1fr}
}

button{
border:0;
border-radius:10px;
padding:10px 14px;
cursor:pointer;
font-weight:bold;
background:#1f6feb;
color:white
}

button.gray{
background:#e8eef5;
color:#172033
}

button.danger{
background:#d92d20;
color:white
}

button.green{
background:#198754;
color:white
}

input,select,textarea{
width:100%;
padding:11px;
border:1px solid #d5dde8;
border-radius:9px;
margin:6px 0 12px;
font-size:15px
}

label{
font-weight:bold;
font-size:13px
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

table{
width:100%;
border-collapse:collapse
}

th,td{
padding:11px;
border-bottom:1px solid #edf0f4;
text-align:right
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:999px;
background:#eaf2ff;
color:#1556a8;
font-size:12px
}

.urgent{
border:2px solid #e04b4b;
background:#fff7f7
}

.muted{
color:#687386
}

.hidden{
display:none
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap
}

.message{
padding:12px;
border-radius:10px;
margin-top:10px;
display:none
}

.success{
background:#e9f8ef;
color:#146c36
}

.error{
background:#fff0f0;
color:#a61b1b
}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#102a43">
</head>

<body>

<header>
<b>MODULAR TECH</b>
<span id="roleLabel"></span>
</header>

<div class="wrap">

<div class="cards" id="stats"></div>

<div class="grid">

<section class="panel" id="formPanel">

<h2 id="formTitle">➕ إضافة طلبية</h2>

<div class="row">

<div>
<label>رقم الطلبية</label>
<input id="num" type="text">
</div>

<div>
<label>اسم الزبون</label>
<input id="customer" type="text">
</div>

</div>

<div class="row">

<div>
<label>رقم الهاتف</label>
<input id="phone" type="tel">
</div>

<div>
<label>موعد التسليم</label>
<input id="due" type="date">
</div>

</div>

<label>ملاحظات</label>
<textarea id="notes" rows="4"></textarea>

<label>
<input id="urgent" type="checkbox" style="width:auto">
⭐ طلبية مهمة جدًا
</label>

<div class="actions">

<button id="saveButton" onclick="saveOrder()">
حفظ الطلبية
</button>

<button id="cancelButton"
class="gray hidden"
onclick="cancelEdit()">
إلغاء التعديل
</button>

</div>

<div id="message" class="message"></div>

</section>

<section class="panel">

<h2>🔎 البحث</h2>

<input
id="search"
type="search"
oninput="render()"
placeholder="رقم الطلبية / اسم الزبون / الهاتف">

<p class="muted">
المسار:
في العمل → القص → الكنت → CNC → التركيب → الدهان → التغليف → التحميل → التسليم
</p>

</section>

</div>

<section class="panel" style="margin-top:18px">

<h2>📋 الطلبيات</h2>

<div id="orders"></div>

</section>

</div>

<script>

/* =========================
   مراحل الطلبية
========================= */

const stages = [
["في العمل","المدير"],
["تم القص","القص"],
["تم الكنت","الكنت"],
["تم CNC","CNC"],
["تم التركيب","التركيب"],
["تم الدهان","الدهان"],
["تم التغليف","التغليف"],
["تم التحميل","التحميل"],
["تم التسليم","التسليم"]
];


/* =========================
   تحميل البيانات
========================= */

let orders = [];

try{

const saved = localStorage.getItem("mt_orders");

if(saved){
orders = JSON.parse(saved);
}

if(!Array.isArray(orders)){
orders = [];
}

}catch(error){

console.error("Load error:",error);
orders = [];

}


let role = localStorage.getItem("mt_role") || "المدير";

let editingId = null;


/* =========================
   المستخدم
========================= */

document.getElementById("roleLabel").textContent =
"المستخدم: " + role;


/* =========================
   رسالة للمستخدم
========================= */

function showMessage(text,type="success"){

const box = document.getElementById("message");

box.textContent = text;

box.className = "message " + type;

box.style.display = "block";

setTimeout(()=>{

box.style.display = "none";

},3000);

}


/* =========================
   حفظ البيانات
========================= */

function save(){

try{

localStorage.setItem(
"mt_orders",
JSON.stringify(orders)
);

return true;

}catch(error){

console.error("Save error:",error);

alert("تعذر حفظ البيانات على الجهاز");

return false;

}

}


/* =========================
   تنظيف النموذج
========================= */

function clearForm(){

document.getElementById("num").value = "";

document.getElementById("customer").value = "";

document.getElementById("phone").value = "";

document.getElementById("due").value = "";

document.getElementById("notes").value = "";

document.getElementById("urgent").checked = false;

}


/* =========================
   إضافة أو تعديل الطلبية
========================= */

function saveOrder(){

const num =
document.getElementById("num").value.trim();

const customer =
document.getElementById("customer").value.trim();

const phone =
document.getElementById("phone").value.trim();

const due =
document.getElementById("due").value;

const notes =
document.getElementById("notes").value.trim();

const urgent =
document.getElementById("urgent").checked;


/* التحقق من البيانات */

if(!num){

alert("أدخل رقم الطلبية");

return;

}

if(!customer){

alert("أدخل اسم الزبون");

return;

}

if(!due){

alert("اختر موعد التسليم");

return;

}


/* =========================
   تعديل طلبية
========================= */

if(editingId !== null){

const index =
orders.findIndex(o => o.id === editingId);

if(index === -1){

alert("لم يتم العثور على الطلبية");

cancelEdit();

return;

}

orders[index].num = num;

orders[index].customer = customer;

orders[index].phone = phone;

orders[index].due = due;

orders[index].notes = notes;

orders[index].urgent = urgent;


if(save()){

showMessage(
"تم تعديل الطلبية وحفظ التغييرات"
);

cancelEdit();

render();

}

return;

}


/* =========================
   التحقق من الرقم المكرر
========================= */

const duplicate = orders.some(o =>
String(o.num).toLowerCase() ===
num.toLowerCase()
);

if(duplicate){

const answer = confirm(
"رقم الطلبية موجود مسبقًا.\nهل تريد إضافة طلبية أخرى بنفس الرقم؟"
);

if(!answer){

return;

}

}


/* =========================
   إنشاء الطلبية
========================= */

const newOrder = {

id: Date.now(),

num: num,

customer: customer,

phone: phone,

due: due,

notes: notes,

urgent: urgent,

stage: 0,

history: [

{

stage: 0,

at: new Date().toLocaleString("ar"),

by: role

}

]

};


/* إضافة الطلبية */

orders.unshift(newOrder);


/* الحفظ */

if(save()){

clearForm();

showMessage(
"✅ تم حفظ الطلبية بنجاح"
);

render();

}

}


/* =========================
   تعديل الطلبية
========================= */

function editOrder(index){

if(role !== "المدير"){

alert("التعديل متاح للمدير فقط");

return;

}

const order = orders[index];

if(!order){

return;

}

editingId = order.id;


document.getElementById("num").value =
order.num || "";

document.getElementById("customer").value =
order.customer || "";

document.getElementById("phone").value =
order.phone || "";

document.getElementById("due").value =
order.due || "";

document.getElementById("notes").value =
order.notes || "";

document.getElementById("urgent").checked =
!!order.urgent;


document.getElementById("formTitle").textContent =
"✏️ تعديل الطلبية";


document.getElementById("saveButton").textContent =
"💾 حفظ التعديل";


document.getElementById("cancelButton")
.classList.remove("hidden");


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   إلغاء التعديل
========================= */

function cancelEdit(){

editingId = null;

clearForm();

document.getElementById("formTitle").textContent =
"➕ إضافة طلبية";

document.getElementById("saveButton").textContent =
"حفظ الطلبية";

document.getElementById("cancelButton")
.classList.add("hidden");

}


/* =========================
   حذف الطلبية
========================= */

function deleteOrder(index){

if(role !== "المدير"){

alert("حذف الطلبيات متاح للمدير فقط");

return;

}

const order = orders[index];

if(!order){

return;

}

const answer = confirm(
"هل أنت متأكد من حذف الطلبية #" +
order.num +
" ؟"
);

if(!answer){

return;

}

orders.splice(index,1);

if(save()){

showMessage(
"تم حذف الطلبية"
);

render();

}

}


/* =========================
   الانتقال للمرحلة التالية
========================= */

function next(index){

const order = orders[index];

if(!order){

return;

}


/* المدير يستطيع نقل أي طلبية */

if(role === "المدير"){

order.stage =
Math.min(
order.stage + 1,
stages.length - 1
);

}


/* القسم */

else{

const expected =
stages[order.stage + 1]?.[1];

if(expected !== role){

alert(
"هذه الطلبية ليست في قسمك"
);

return;

}

order.stage++;

}


/* تسجيل الحركة */

if(!Array.isArray(order.history)){

order.history = [];

}

order.history.push({

stage: order.stage,

at: new Date().toLocaleString("ar"),

by: role

});


if(save()){

render();

}

}


/* =========================
   تفاصيل الطلبية
========================= */

function details(index){

const order = orders[index];

if(!order){

return;

}

let text =

"#" + order.num +

"\nالزبون: " +
order.customer +

"\nالهاتف: " +
(order.phone || "") +

"\nالموقع الحالي: " +
stages[order.stage][1] +

"\nالحالة: " +
stages[order.stage][0] +

"\nموعد التسليم: " +
order.due +

"\nالملاحظات: " +
(order.notes || "") +

"\n\nسجل الحركة:\n";


text +=

(order.history || [])

.map(h =>

stages[h.stage][0] +
" — " +
h.at +
(h.by ? " — " + h.by : "")

)

.join("\n");


alert(text);

}


/* =========================
   عرض الإحصائيات والطلبيات
========================= */

function render(){

const search =
document.getElementById("search")
.value
.trim()
.toLowerCase();


const filtered =
orders.filter(order =>

[
order.num,
order.customer,
order.phone
]
.join(" ")
.toLowerCase()
.includes(search)

);


/* =========================
   الإحصائيات
========================= */

const total =
orders.length;

const active =
orders.filter(order =>
order.stage < stages.length - 1
).length;

const urgent =
orders.filter(order =>
order.urgent
).length;

const overdue =
orders.filter(order => {

const dueDate =
new Date(order.due + "T23:59:59");

return (
dueDate < new Date() &&
order.stage < stages.length - 1
);

}).length;


document.getElementById("stats").innerHTML = [

["إجمالي الطلبيات",total],

["في العمل",active],

["مهمة جدًا",urgent],

["متأخرة",overdue]

]

.map(item =>

`<div class="card">
${item[0]}
<strong>${item[1]}</strong>
</div>`

)

.join("");


/* =========================
   لا توجد نتائج
========================= */

if(!filtered.length){

document.getElementById("orders").innerHTML =
"<p class='muted'>لا توجد طلبيات.</p>";

return;

}


/* =========================
   جدول الطلبيات
========================= */

let html = `

<table>

<tr>

<th>الطلبية</th>

<th>الزبون</th>

<th>الموعد</th>

<th>الحالة</th>

<th>إجراء</th>

</tr>

`;


filtered.forEach(order => {

const realIndex =
orders.indexOf(order);


html += `

<tr class="${order.urgent ? "urgent" : ""}">

<td>

${order.urgent ? "⭐ " : ""}

<b>#${order.num}</b>

</td>


<td>

${order.customer}

<br>

<span class="muted">

${order.phone || ""}

</span>

</td>


<td>

${order.due}

</td>


<td>

<span class="badge">

${stages[order.stage][0]}

</span>

<br>

<small>

${order.stage === 0
? "المدير"
: stages[order.stage][1]}

</small>

</td>


<td>

<div class="actions">

`;


/* زر المرحلة التالية */

if(order.stage < stages.length - 1){

html += `

<button onclick="next(${realIndex})">

تم ${stages[order.stage + 1][1]}

</button>

`;

}


/* التفاصيل */

html += `

<button
class="gray"
onclick="details(${realIndex})">

التفاصيل

</button>

`;


/* أزرار المدير */

if(role === "المدير"){

html += `

<button
class="green"
onclick="editOrder(${realIndex})">

✏️ تعديل

</button>


<button
class="danger"
onclick="deleteOrder(${realIndex})">

🗑️ حذف

</button>

`;

}


html += `

</div>

</td>

</tr>

`;

});


html += "</table>";


document.getElementById("orders").innerHTML =
html;

}


/* =========================
   تشغيل النموذج حسب الصلاحية
========================= */

document
.getElementById("formPanel")
.classList
.toggle(
"hidden",
role !== "المدير"
);


/* =========================
   تشغيل التطبيق
========================= */

render();


/* =========================
   Service Worker
========================= */

if("serviceWorker" in navigator){

navigator.serviceWorker
.register("./sw.js")
.then(() => {

console.log(
"MODULAR TECH Service Worker registered"
);

})
.catch(error => {

console.error(
"Service Worker error:",
error
);

});

}

</script>

</body>
</html>
