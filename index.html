<script>

const SUPABASE_URL =
"https://bvrfrcmblwzuqprjknam.supabase.co";

/* المفتاح الصحيح الذي أرسلته */
const SUPABASE_KEY =
"sb_publishable_vVXVJGcWpoPvPEH_bfm23Q_dZ5eXvmE";

let orders = [];
let currentProfile = null;
let role = "";

async function supabaseRequest(
table,
method="GET",
body=null,
query=""
){

const token =
localStorage.getItem(
"supabase_access_token"
) || SUPABASE_KEY;

const options = {

method,

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+token,
"Content-Type":"application/json",
"Prefer":"return=representation"
}

};

if(body !== null){
options.body =
JSON.stringify(body);
}

const response =
await fetch(
SUPABASE_URL+
"/rest/v1/"+
table+
query,
options
);

const text =
await response.text();

let data;

try{
data =
text
?
JSON.parse(text)
:
null;
}catch(e){
data=text;
}

if(!response.ok){

throw new Error(

typeof data==="object"
?
(
data.message ||
data.error ||
data.hint ||
JSON.stringify(data)
)
:
data

);

}

return data;
}

async function authRequest(
endpoint,
method="POST",
body=null
){

const options = {

method,

headers:{
"apikey":SUPABASE_KEY,
"Content-Type":"application/json"
}

};

if(body !== null){
options.body =
JSON.stringify(body);
}

const response =
await fetch(
SUPABASE_URL+
"/auth/v1/"+
endpoint,
options
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
data.message ||
"فشل تسجيل الدخول"
);

}

return data;
}

function message(text){

const box =
document.getElementById(
"message"
);

box.textContent=text;

box.style.display="block";

setTimeout(
()=>{
box.style.display="none";
},
2500
);

}

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/[&<>"']/g,
function(char){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[char];

}
);

}

async function login(){

const username =
document
.getElementById(
"loginUsername"
)
.value
.trim();

const password =
document
.getElementById(
"loginPassword"
)
.value;

const errorBox =
document.getElementById(
"loginError"
);

errorBox.style.display="none";

if(!username || !password){

errorBox.textContent =
"يرجى إدخال اسم المستخدم وكلمة المرور";

errorBox.style.display="block";

return;

}

try{

const result =
await supabaseRequest(
"rpc/get_login_email",
"POST",
{
p_username:username
}
);

let email = null;

if(typeof result === "string"){

email=result;

}else if(Array.isArray(result)){

email =
result[0]?.email ||
result[0] ||
null;

}else if(result){

email =
result.email ||
result;

}

if(!email){

throw new Error(
"اسم المستخدم غير موجود أو الحساب غير فعال"
);

}

const session =
await authRequest(
"token?grant_type=password",
"POST",
{
email:email,
password:password
}
);

localStorage.setItem(
"supabase_access_token",
session.access_token
);

if(session.refresh_token){

localStorage.setItem(
"supabase_refresh_token",
session.refresh_token
);

}

await loadProfile(
session.user.id,
email,
username
);

showApp();

await loadOrders();

message(
"✅ تم تسجيل الدخول"
);

}catch(error){

console.error(error);

errorBox.textContent =
"❌ "+error.message;

errorBox.style.display="block";

}

}

async function loadProfile(
userId,
email="",
username=""
){

currentProfile=null;

try{

const data =
await supabaseRequest(
"profiles",
"GET",
null,
"?select=id,username,full_name,role,active,email"+
"&id=eq."+
encodeURIComponent(userId)+
"&limit=1"
);

if(
Array.isArray(data) &&
data.length
){

currentProfile=data[0];

}

}catch(error){

console.warn(
"Profile ID lookup:",
error
);

}

if(!currentProfile && email){

try{

const data =
await supabaseRequest(
"profiles",
"GET",
null,
"?select=id,username,full_name,role,active,email"+
"&email=eq."+
encodeURIComponent(email)+
"&limit=1"
);

if(
Array.isArray(data) &&
data.length
){

currentProfile=data[0];

}

}catch(error){

console.warn(
"Profile email lookup:",
error
);

}

}

if(!currentProfile && username){

try{

const data =
await supabaseRequest(
"profiles",
"GET",
null,
"?select=id,username,full_name,role,active,email"+
"&username=eq."+
encodeURIComponent(username)+
"&limit=1"
);

if(
Array.isArray(data) &&
data.length
){

currentProfile=data[0];

}

}catch(error){

console.warn(
"Profile username lookup:",
error
);

}

}

if(!currentProfile){

throw new Error(
"لم يتم العثور على ملف المستخدم. تأكد من وجود المستخدم داخل جدول profiles وربطه بحساب Auth."
);

}

if(
currentProfile.active === false
){

throw new Error(
"هذا الحساب غير فعال"
);

}

role =
currentProfile.role ||
"";

document.getElementById(
"currentUser"
).textContent =

(
currentProfile.full_name ||
currentProfile.username ||
"المستخدم"
)

+
" — "
+
role;

}

function showApp(){

document
.getElementById(
"loginPage"
)
.classList
.add("hidden");

document
.getElementById(
"app"
)
.classList
.remove("hidden");

applyPermissions();

}

async function checkSession(){

const token =
localStorage.getItem(
"supabase_access_token"
);

if(!token){
return;
}

try{

const response =
await fetch(
SUPABASE_URL+
"/auth/v1/user",
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+token
}
}
);

if(!response.ok){
throw new Error();
}

const user =
await response.json();

await loadProfile(
user.id,
user.email,
""
);

showApp();

await loadOrders();

}catch(error){

console.warn(
"Session invalid:",
error
);

localStorage.removeItem(
"supabase_access_token"
);

localStorage.removeItem(
"supabase_refresh_token"
);

}

}

function logout(){

localStorage.removeItem(
"supabase_access_token"
);

localStorage.removeItem(
"supabase_refresh_token"
);

location.reload();

}

function applyPermissions(){

const isAdmin =
role === "المدير";

document
.getElementById(
"usersNav"
)
.classList
.toggle(
"hidden",
!isAdmin
);

document
.querySelectorAll(
".admin-only"
)
.forEach(
button=>{

button
.classList
.toggle(
"hidden",
!isAdmin
);

}
);

}

const stages = [

["في العمل","المدير"],
["تم القص","القص"],
["تم الكنت","الكنت"],
["تم CNC","CNC"],
["تم التركيب","التركيب"],
["تم الدهان","الدهان"],
["تم التغليف","التغليف"],
["تم التحميل","التحميل"],
["تم التسليم","التسليم"]

];

async function loadOrders(){

try{

const data =
await supabaseRequest(
"orders",
"GET",
null,
"?select=id,order_number,customer_name,phone,due_date,notes,urgent,stage,created_at,updated_at"+
"&order=created_at.desc"
);

orders =
Array.isArray(data)
?
data
:
[];

renderAll();

}catch(error){

console.error(error);

document.getElementById(
"latestOrders"
).innerHTML =

document.getElementById(
"ordersList"
).innerHTML =
"<div class='empty'>❌ تعذر تحميل الطلبيات</div>";

}

}

function normalizeOrder(order){

return{

id:order.id,

num:order.order_number || "",

customer:order.customer_name || "",

phone:order.phone || "",

due:order.due_date || "",

notes:order.notes || "",

urgent:!!order.urgent,

stage:Number(order.stage || 0),

created_at:order.created_at,

updated_at:order.updated_at

};

}

function isOverdue(order){

if(!order.due){
return false;
}

return(

new Date(
order.due+
"T23:59:59"
)
<
new Date()

)
&&
order.stage <
stages.length-1;

}

}

);

null,

);

);

);

async function nextStage(id){

const order =
orders
.map(normalizeOrder)
.find(
o=>String(o.id) === String(id)
);

if(!order){
return;
}

const next =
order.stage + 1;

if(next >= stages.length){
return;
}

if(role !== "المدير"){

const expected =
stages[next][1];

if(expected !== role){

alert(
"هذه المرحلة ليست ضمن صلاحيات قسمك"
);

return;

}

}

try{

await supabaseRequest(
"orders",
"PATCH",
{
stage:next,
updated_at:
new Date()
.toISOString()
},
"?id=eq."+
encodeURIComponent(id)
);

message(
"✅ تم تحديث المرحلة"
);

await loadOrders();

}catch(error){

alert(
"❌ فشل تحديث المرحلة\n\n"+
error.message
);

}

}

</div>

${escapeHtml(order.customer)}

</div>

</div>

<span class="badge ${isOverdue(order) ? "overdue" : ""}">

${
isOverdue(order)

"متأخرة"

stages[order.stage]?.[0] ||
"في العمل"
)
}

</span>

</div>

<div class="info">

<div class="info-box">

📞 الهاتف

<b>
${escapeHtml(order.phone || "-")}
</b>

</div>

<div class="info-box">

📅 التسليم

<b>
${escapeHtml(order.due || "-")}
</b>

</div>

<div class="info-box">

🏭 القسم

<b>
${escapeHtml(
stages[order.stage]?.[1] ||
"-"
)}
</b>

</div>

</div>

<div class="actions">

<button
class="secondary"
onclick="details('${order.id}')"
>
📋 التفاصيل
</button>

${
role === "المدير"
?
`

<button
class="success"
onclick="editOrder('${order.id}')"
>
✏️ تعديل
</button>

<button
class="danger"
onclick="deleteOrder('${order.id}')"
>
🗑️ حذف
</button>

`
:
""
}

${
order.stage < stages.length-1
?

`

<button
class="primary"
onclick="nextStage('${order.id}')"
>
➡️ تم ${escapeHtml(
stages[order.stage+1][1]
)}
</button>

`

:

`

<span class="badge">
✅ مكتملة
</span>

`
}

</div>

</div>

`;

}

function renderDashboard(){

const list =
orders.map(
normalizeOrder
);

document.getElementById(
"totalCount"
).textContent =
list.length;

document.getElementById(
"activeCount"
).textContent =

list.filter(
o=>o.stage <
stages.length-1
).length;

document.getElementById(
"urgentCount"
).textContent =

list.filter(
o=>o.urgent
).length;

document.getElementById(
"overdueCount"
).textContent =

list.filter(
isOverdue
).length;

const latest =
list.slice(0,5);

document.getElementById(
"latestOrders"
).innerHTML =

latest.length
?
latest
.map(orderHtml)
.join("")
:
"<div class='empty'>لا توجد طلبيات حتى الآن</div>";

}

function renderOrders(){

const search =

(
document.getElementById(
"search"
)?.value ||
""
)

.trim()
.toLowerCase();

const list =
orders.map(
normalizeOrder
);

const filtered =

list.filter(
order=>

[
order.num,
order.customer,
order.phone
]

.join(" ")
.toLowerCase()
.includes(search)

);

document.getElementById(
"ordersList"
).innerHTML =

filtered.length
?
filtered
.map(orderHtml)
.join("")
:
"<div class='empty'>لا توجد طلبيات مطابقة.</div>";

}

function renderStages(){

const list =
orders.map(
normalizeOrder
);

document.getElementById(
"stageList"
).innerHTML =

stages

.map(
(stage,index)=>{

const stageOrders =

list.filter(
o=>o.stage === index
);

return `

<div class="stage-card">

<div class="order-head">

<div>

<div class="order-number">
${stage[0]}
</div>

<div class="customer">
القسم المسؤول:
${stage[1]}
</div>

</div>

<span class="badge">
${stageOrders.length}
طلبية
</span>

</div>

${
stageOrders.length
?
stageOrders
.map(orderHtml)
.join("")
:

`

<div class="empty">
لا توجد طلبيات في هذه المرحلة
</div>

`

}

</div>

`;

}
)

.join("");

}
