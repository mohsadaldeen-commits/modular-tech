<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>MODULAR TECH</title>

<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">

<style>
:root{
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#718096;
  --border:#e5eaf1;
  --primary:#2563eb;
  --primary2:#1d4ed8;
  --success:#16a34a;
  --danger:#dc2626;
  --warning:#f59e0b;
  --dark:#0b1220;
  --dark2:#111b2e;
  --shadow:0 10px 35px rgba(15,23,42,.08);
  --radius:20px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    Arial,
    "Noto Sans Hebrew",
    "Segoe UI",
    sans-serif;
  background:
    radial-gradient(circle at top right,#eaf2ff 0,transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
LOGIN
========================= */

#loginPage{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 20%,rgba(59,130,246,.22),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(14,165,233,.16),transparent 30%),
    linear-gradient(135deg,#07101f,#0f1f38 55%,#123a64);
}

.login-box{
  width:100%;
  max-width:440px;
  background:rgba(255,255,255,.98);
  border:1px solid rgba(255,255,255,.3);
  border-radius:30px;
  padding:34px;
  box-shadow:
    0 30px 80px rgba(0,0,0,.25),
    0 5px 20px rgba(0,0,0,.08);
  animation:loginIn .45s ease;
}

@keyframes loginIn{
  from{
    opacity:0;
    transform:translateY(20px) scale(.98);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.login-icon{
  width:76px;
  height:76px;
  margin:0 auto 18px;
  border-radius:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#2563eb,#0ea5e9);
  color:white;
  font-size:34px;
  box-shadow:0 12px 30px rgba(37,99,235,.3);
}

.login-logo{
  text-align:center;
  font-size:29px;
  font-weight:900;
  letter-spacing:.5px;
  color:#102a43;
}

.login-sub{
  text-align:center;
  color:var(--muted);
  margin:8px 0 26px;
  font-size:14px;
}

.login-language{
  display:flex;
  justify-content:center;
  margin-bottom:20px;
}

.lang-switch{
  display:flex;
  gap:4px;
  padding:4px;
  background:#edf2f7;
  border-radius:12px;
}

.lang-switch button{
  border:0;
  background:transparent;
  color:#64748b;
  padding:8px 13px;
  border-radius:9px;
  font-weight:800;
}

.lang-switch button.active{
  background:white;
  color:#1d4ed8;
  box-shadow:0 2px 8px #00000012;
}

label{
  display:block;
  font-weight:800;
  font-size:13px;
  margin-bottom:7px;
}

input,
textarea,
select{
  width:100%;
  padding:13px 14px;
  margin:5px 0 15px;
  border:1px solid #dbe3ed;
  border-radius:12px;
  font-size:15px;
  background:#fff;
  color:var(--text);
  outline:none;
  transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#60a5fa;
  box-shadow:0 0 0 4px rgba(37,99,235,.1);
}

.login-btn{
  width:100%;
  padding:14px;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:#fff;
  font-size:16px;
  border:0;
  border-radius:13px;
  font-weight:900;
  box-shadow:0 10px 20px rgba(37,99,235,.22);
  transition:.2s;
}

.login-btn:hover{
  transform:translateY(-1px);
}

.login-error{
  background:#fff1f2;
  color:#b91c1c;
  border:1px solid #fecdd3;
  padding:12px;
  border-radius:12px;
  margin-bottom:15px;
  display:none;
  font-weight:bold;
  line-height:1.6;
}

/* =========================
HEADER
========================= */

header{
  background:
    linear-gradient(135deg,#0b1220,#111c31);
  color:#fff;
  padding:13px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 5px 25px rgba(0,0,0,.16);
  backdrop-filter:blur(12px);
}

.logo-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-mini{
  width:42px;
  height:42px;
  border-radius:13px;
  background:linear-gradient(135deg,#2563eb,#0ea5e9);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  box-shadow:0 7px 20px rgba(37,99,235,.25);
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:.4px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.user-box{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  padding:8px 12px;
}

.user{
  font-size:13px;
  opacity:.95;
}

.header-lang{
  background:rgba(255,255,255,.08);
  color:#fff;
  border:1px solid rgba(255,255,255,.12);
  padding:8px 11px;
  border-radius:10px;
  font-weight:800;
}

.logout{
  background:#dc2626;
  color:#fff;
  padding:9px 13px;
  border:0;
  border-radius:10px;
  font-weight:800;
}

/* =========================
CONTAINER
========================= */

.container{
  max-width:1350px;
  margin:auto;
  padding:22px;
}

/* =========================
NAV
========================= */

.nav{
  display:flex;
  gap:9px;
  overflow-x:auto;
  margin-bottom:22px;
  padding:4px;
  scrollbar-width:none;
}

.nav::-webkit-scrollbar{
  display:none;
}

.nav button{
  white-space:nowrap;
  border:1px solid var(--border);
  border-radius:13px;
  padding:11px 17px;
  background:#fff;
  color:#334155;
  font-weight:800;
  transition:.2s;
  box-shadow:0 3px 10px #00000006;
}

.nav button:hover{
  transform:translateY(-1px);
}

.nav button.active{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:#fff;
  border-color:transparent;
  box-shadow:0 8px 18px rgba(37,99,235,.2);
}

/* =========================
STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:20px;
  position:relative;
  overflow:hidden;
}

.stat::after{
  content:"";
  position:absolute;
  width:80px;
  height:80px;
  border-radius:50%;
  background:#2563eb10;
  left:-25px;
  bottom:-30px;
}

.stat-title{
  font-size:13px;
  color:var(--muted);
  font-weight:700;
}

.stat-number{
  font-size:32px;
  font-weight:900;
  margin-top:8px;
  color:#172033;
}

/* =========================
PANELS
========================= */

.panel{
  background:rgba(255,255,255,.96);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:20px;
  margin-bottom:20px;
}

.panel h2{
  margin:0;
  font-size:20px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
}

.section-icon{
  width:40px;
  height:40px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eff6ff;
  color:#2563eb;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

button{
  border:0;
  border-radius:11px;
  padding:10px 14px;
  font-weight:800;
  transition:.18s;
}

button:hover{
  transform:translateY(-1px);
}

.primary{
  background:#2563eb;
  color:#fff;
}

.primary:hover{
  background:#1d4ed8;
}

.success{
  background:#16a34a;
  color:#fff;
}

.danger{
  background:#dc2626;
  color:#fff;
}

.secondary{
  background:#edf2f7;
  color:#253449;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:13px;
}

/* =========================
ORDERS
========================= */

.order-list{
  display:grid;
  gap:13px;
}

.order{
  border:1px solid var(--border);
  border-radius:17px;
  padding:16px;
  background:#fff;
  transition:.2s;
}

.order:hover{
  box-shadow:0 8px 25px #0000000b;
  transform:translateY(-1px);
}

.order.urgent{
  border:2px solid #f87171;
  background:#fff8f8;
}

.order-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.order-number{
  font-size:18px;
  font-weight:900;
}

.customer{
  margin-top:6px;
  font-weight:800;
}

.info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:13px;
}

.info-box{
  background:#f7f9fc;
  border:1px solid #eef2f7;
  border-radius:11px;
  padding:10px;
  font-size:12px;
  color:#718096;
}

.info-box b{
  display:block;
  margin-top:5px;
  font-size:13px;
  color:#263449;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:6px 10px;
  border-radius:999px;
  background:#eaf2ff;
  color:#1556a8;
  font-size:12px;
  font-weight:900;
}

.overdue{
  background:#ffe8e8;
  color:#a61b1b;
}

.empty{
  text-align:center;
  padding:35px 20px;
  color:var(--muted);
  line-height:1.7;
}

/* =========================
STAGES
========================= */

.stage-card,
.user-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:17px;
  padding:16px;
  box-shadow:0 3px 14px #00000006;
}

.user-card{
  margin-bottom:11px;
}

/* =========================
MODALS
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.68);
  backdrop-filter:blur(5px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:100;
}

.modal-box{
  background:#fff;
  width:100%;
  max-width:620px;
  max-height:92vh;
  overflow:auto;
  border-radius:23px;
  padding:22px;
  box-shadow:0 30px 80px #0005;
  animation:modalIn .25s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(15px) scale(.98);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.modal-head h2{
  margin:0;
}

.close{
  background:#edf2f7;
  color:#334155;
  font-size:20px;
  padding:6px 12px;
}

.check{
  display:flex;
  align-items:center;
  gap:8px;
  margin:5px 0 12px;
  font-weight:800;
}

.check input{
  width:auto;
  margin:0;
  accent-color:#2563eb;
}

/* =========================
SEARCH
========================= */

#search{
  background:#f8fafc;
  border-radius:13px;
  padding:14px;
  margin:16px 0;
}

/* =========================
MESSAGE
========================= */

.message{
  position:fixed;
  bottom:20px;
  left:20px;
  right:20px;
  max-width:520px;
  margin:auto;
  padding:14px 17px;
  border-radius:14px;
  background:#16a34a;
  color:#fff;
  font-weight:900;
  text-align:center;
  display:none;
  z-index:200;
  box-shadow:0 12px 30px #0003;
}

/* =========================
MOBILE
========================= */

@media(max-width:900px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:650px){

  header{
    padding:11px 12px;
  }

  .logo-mini{
    width:37px;
    height:37px;
  }

  .logo{
    font-size:16px;
  }

  .user-box{
    display:none;
  }

  .header-lang{
    padding:7px 9px;
    font-size:12px;
  }

  .logout{
    padding:8px 10px;
    font-size:12px;
  }

  .container{
    padding:12px;
  }

  .panel{
    padding:15px;
    border-radius:18px;
  }

  .stats{
    gap:9px;
  }

  .stat{
    padding:14px;
    border-radius:16px;
  }

  .stat-number{
    font-size:25px;
  }

  .stat-title{
    font-size:11px;
  }

  .row{
    grid-template-columns:1fr;
  }

  .info{
    grid-template-columns:1fr 1fr;
  }

  .order-head{
    align-items:flex-start;
  }

  .order-number{
    font-size:16px;
  }

  .customer{
    font-size:14px;
  }

  .actions button{
    flex:1;
    min-width:110px;
  }

  .login-box{
    padding:25px 20px;
    border-radius:24px;
  }

}

@media(max-width:380px){

  .info{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<!-- =====================================================
LOGIN
===================================================== -->

<div id="loginPage">

  <div class="login-box">

    <div class="login-icon">📦</div>

    <div class="login-logo">
      MODULAR TECH
    </div>

    <div class="login-sub" data-i18n="appSubtitle">
      نظام إدارة الطلبيات
    </div>

    <div class="login-language">
      <div class="lang-switch">
        <button id="loginArBtn" onclick="setLanguage('ar')">العربية</button>
        <button id="loginHeBtn" onclick="setLanguage('he')">עברית</button>
      </div>
    </div>

    <div id="loginError" class="login-error"></div>

    <label data-i18n="username">
      اسم المستخدم
    </label>

    <input
      id="loginUsername"
      autocomplete="username"
      placeholder="أدخل اسم المستخدم"
      data-i18n-placeholder="usernamePlaceholder"
    >

    <label data-i18n="password">
      كلمة المرور
    </label>

    <input
      id="loginPassword"
      type="password"
      autocomplete="current-password"
      placeholder="أدخل كلمة المرور"
      data-i18n-placeholder="passwordPlaceholder"
    >

    <button
      class="login-btn"
      onclick="login()"
      data-i18n="login"
    >
      🔐 تسجيل الدخول
    </button>

  </div>
</div>


<!-- =====================================================
APP
===================================================== -->

<div id="app" class="hidden">

<header>

  <div class="logo-area">

    <div class="logo-mini">
      📦
    </div>

    <div class="logo">
      MODULAR TECH
    </div>

  </div>

  <div class="header-right">

    <div class="user-box">
      <span class="user" id="currentUser"></span>
    </div>

    <button
      class="header-lang"
      id="languageButton"
      onclick="toggleLanguage()"
    >
      עברית
    </button>

    <button
      class="logout"
      onclick="logout()"
      data-i18n="logout"
    >
      خروج
    </button>

  </div>

</header>


<div class="container">

<!-- =====================================================
NAV
===================================================== -->

<div class="nav">

  <button
    class="active"
    onclick="showSection('dashboard',this)"
    data-i18n="dashboard"
  >
    🏠 الرئيسية
  </button>

  <button
    onclick="showSection('ordersSection',this)"
    data-i18n="orders"
  >
    📋 الطلبيات
  </button>

  <button
    onclick="showSection('production',this)"
    data-i18n="production"
  >
    🏭 مراحل العمل
  </button>

  <button
    id="usersNav"
    onclick="showSection('users',this)"
    data-i18n="users"
  >
    👥 المستخدمون
  </button>

</div>


<!-- =====================================================
DASHBOARD
===================================================== -->

<section id="dashboard">

  <div class="stats">

    <div class="stat">
      <div class="stat-title" data-i18n="totalOrders">
        إجمالي الطلبيات
      </div>
      <div class="stat-number" id="totalCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-title" data-i18n="inProgress">
        قيد العمل
      </div>
      <div class="stat-number" id="activeCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-title" data-i18n="urgent">
        مهمة جدًا
      </div>
      <div class="stat-number" id="urgentCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-title" data-i18n="overdue">
        متأخرة
      </div>
      <div class="stat-number" id="overdueCount">0</div>
    </div>

  </div>


  <div class="panel">

    <div class="order-head">

      <div class="section-title">

        <div class="section-icon">📋</div>

        <h2 data-i18n="latestOrders">
          آخر الطلبيات
        </h2>

      </div>

      <button
        class="primary admin-only"
        onclick="openAddModal()"
        data-i18n="addOrder"
      >
        ➕ إضافة طلبية
      </button>

    </div>

    <div id="latestOrders"></div>

  </div>

</section>


<!-- =====================================================
ORDERS
===================================================== -->

<section id="ordersSection" class="hidden">

  <div class="panel">

    <div class="order-head">

      <div class="section-title">

        <div class="section-icon">📋</div>

        <h2 data-i18n="manageOrders">
          إدارة الطلبيات
        </h2>

      </div>

      <button
        class="primary admin-only"
        onclick="openAddModal()"
        data-i18n="addOrder"
      >
        ➕ إضافة طلبية
      </button>

    </div>

    <input
      id="search"
      type="search"
      placeholder="🔎 ابحث برقم الطلبية أو اسم الزبون أو الهاتف"
      data-i18n-placeholder="searchPlaceholder"
      oninput="renderOrders()"
    >

    <div id="ordersList" class="order-list"></div>

  </div>

</section>


<!-- =====================================================
PRODUCTION
===================================================== -->

<section id="production" class="hidden">

  <div class="panel">

    <div class="section-title">

      <div class="section-icon">🏭</div>

      <h2 data-i18n="workStages">
        مراحل العمل
      </h2>

    </div>

    <div id="stageList" class="order-list"></div>

  </div>

</section>


<!-- =====================================================
USERS
===================================================== -->

<section id="users" class="hidden">

  <div class="panel">

    <div class="order-head">

      <div class="section-title">

        <div class="section-icon">👥</div>

        <h2 data-i18n="users">
          المستخدمون
        </h2>

      </div>

      <button
        class="primary"
        onclick="openUserModal()"
        data-i18n="addUser"
      >
        ➕ إضافة مستخدم
      </button>

    </div>

    <div id="usersList">

      <div class="empty" data-i18n="loadingUsers">
        ⏳ جاري تحميل المستخدمين...
      </div>

    </div>

  </div>

</section>

</div>
</div>


<!-- =====================================================
MESSAGE
===================================================== -->

<div id="message" class="message"></div>


<!-- =====================================================
ORDER MODAL
===================================================== -->

<div id="orderModal" class="modal hidden">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        ➕ إضافة طلبية
      </h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <form id="orderForm">

      <input type="hidden" id="editId">

      <label data-i18n="orderNumber">
        رقم الطلبية
      </label>

      <input
        id="orderNum"
        required
        placeholder="مثال: 10025"
      >

      <label data-i18n="customerName">
        اسم الزبون
      </label>

      <input
        id="customer"
        required
        placeholder="اسم الزبون"
      >

      <div class="row">

        <div>

          <label data-i18n="phone">
            رقم الهاتف
          </label>

          <input
            id="phone"
            type="tel"
            placeholder="05xxxxxxxx"
          >

        </div>

        <div>

          <label data-i18n="deliveryDate">
            موعد التسليم
          </label>

          <input
            id="due"
            type="date"
            required
          >

        </div>

      </div>

      <label data-i18n="notes">

/* =====================================================
SUPABASE REQUEST
===================================================== */

async function request(
path,
method="GET",
body=null
){

const token =
localStorage.getItem(
"supabase_access_token"
);

const authToken =
token || SUPABASE_KEY;

const options={

method:method,

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+authToken,
"Content-Type":"application/json",
"Prefer":"return=representation"
}

};

if(body!==null){

options.body=
JSON.stringify(body);

}

const response =
await fetch(
SUPABASE_URL+path,
options
);

const text =
await response.text();

let data;

try{

data =
text
?
JSON.parse(text)
:
null;

}catch{

data=text;

}

if(!response.ok){

let message;

if(
typeof data==="object" &&
data
){

message =
data.message ||
data.error_description ||
data.error ||
data.hint ||
JSON.stringify(data);

}else{

message =
data ||
("HTTP "+response.status);

}

throw new Error(message);

}

return data;

}


/* =====================================================
AUTH
===================================================== */

async function auth(
path,
body
){

const response =
await fetch(
SUPABASE_URL+
"/auth/v1/"+
path,
{

method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Content-Type":
"application/json"
},

body:
JSON.stringify(body)

}
);

const text =
await response.text();

let data;

try{

data =
text
?
JSON.parse(text)
:
{};

}catch{

data={
message:text
};

}

if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
data.message ||
"فشل تسجيل الدخول"
);

}

return data;

}

/* =====================================================
ESCAPE
===================================================== */

function esc(value){

return String(value ?? "")
.replace(
/[&<>"']/g,
function(char){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[char];

}
);

}

);

result[0] ||
null;

}else if(result){

email =
result.email ||
result;

t("notFound")
);

}

const session =
await auth(
"token?grant_type=password",

}
);

?
"לא התקבל חיבור מ-Supabase Auth"

);

"supabase_access_token",
session.access_token
);

localStorage.setItem(
"supabase_refresh_token",
session.refresh_token
);

}

await loadProfile(
session.user.id,
session.user.email,
username
);

msg(

/* =====================================================
NORMALIZE
===================================================== */

function norm(order){

return{

id:order.id,

num:
order.order_number ||
"",

customer:
order.customer_name ||
"",

phone:
order.phone ||
"",

due:
order.due_date ||
"",

notes:
order.notes ||
"",

urgent:
!!order.urgent,

stage:
Number(order.stage || 0)

};

}


/* =====================================================
OVERDUE
===================================================== */

function overdue(order){

return(
order.due &&
new Date(
order.due+
"T23:59:59"
) <
new Date() &&
order.stage <
stages.length-1
);

}

/* =====================================================
NEXT STAGE
===================================================== */

async function nextStage(id){

const order =
orders
.map(norm)
.find(
x=>String(x.id)===
String(id)
);

if(!order){

return;

}

const next =
order.stage+1;

if(
next>=stages.length
){

return;

}

if(
role!=="المدير" &&
stages[next].role!==role
){

alert(
currentLanguage==="he"
?
"אין לך הרשאה לשלב זה"
:
"هذه المرحلة ليست ضمن صلاحيات قسمك"
);

return;

}

try{

await request(
"/rest/v1/orders?id=eq."+
encodeURIComponent(id),
"PATCH",
{
stage:next,
updated_at:
new Date().toISOString()
}
);

await loadOrders();

msg(t("stageUpdated"));

}catch(error){

alert(
"❌ "+
error.message
);

}

}

/* =====================================================
CREATE USER
===================================================== */

document
.getElementById("userForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

if(role!=="المدير"){

alert(t("adminOnly"));

return;

}

const username =
document.getElementById(
"newUsername"
).value.trim();

const fullName =
document.getElementById(
"newFullName"
).value.trim();

const email =
document.getElementById(
"newEmail"
).value.trim();

const password =
document.getElementById(
"newPassword"
).value;

const userRole =
document.getElementById(
"newRole"
).value;

const active =
document.getElementById(
"newActive"
).checked;

if(
!username||
!fullName||
!email||
!password
){

alert(
currentLanguage==="he"
?
"נא למלא את כל השדות"
:
"يرجى تعبئة جميع البيانات"
);

return;

}

if(password.length<6){

alert(
currentLanguage==="he"
?
"הסיסמה חייבת להכיל לפחות 6 תווים"
:
"كلمة المرور يجب أن تكون 6 أحرف على الأقل"
);

return;

}

try{

const token =
localStorage.getItem(
"supabase_access_token"
);

if(!token){

throw new Error(
t("sessionExpired")
);

}

const response =
await fetch(
CREATE_USER_FUNCTION,
{

method:"POST",

headers:{
"Content-Type":
"application/json",

"Authorization":
"Bearer "+token,

"apikey":
SUPABASE_KEY

},

body:
JSON.stringify({

username:
username,

full_name:
fullName,

email:
email,

password:
password,

role:
userRole,

active:
active

})

}
);

const text =
await response.text();

let data;

try{

data =
text
?
JSON.parse(text)
:
{};

}catch{

data={
message:text
};

}

if(!response.ok){

throw new Error(

data.message||
data.error||
data.error_description||
(
currentLanguage==="he"
?
"יצירת המשתמש נכשלה"
:
"فشل إنشاء المستخدم"
)

);

}

closeUserModal();

document
.getElementById("userForm")
.reset();

document.getElementById(
"newActive"
).checked=true;

await loadUsers();

msg(t("userCreated"));

}catch(error){

console.error(
"CREATE USER ERROR:",
error
);

let message =
error.message||
(
currentLanguage==="he"
?
"יצירת המשתמש נכשלה"
:
"فشل إنشاء المستخدم"
);

if(
message
.toLowerCase()
.includes(
"already registered"
)
){

message =
currentLanguage==="he"
?
"כתובת הדואר האלקטרוני כבר קיימת ב-Auth"
:
"هذا البريد الإلكتروني مستخدم مسبقًا في Auth";

}

alert(
"❌ "+
message
);

}

});
