<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>MODULAR TECH</title>
<link rel="manifest" href="manifest.webmanifest">

<style>
*{box-sizing:border-box}
:root{
 --bg:#eef3f9;--card:#fff;--dark:#07111f;--dark2:#10233d;
 --primary:#1677ff;--primary2:#00b8ff;--text:#122033;
 --muted:#718096;--border:#dfe7f1;--danger:#ef4444;
 --success:#10b981;--warning:#f59e0b;--sidebar:285px;
}
html,body{
 margin:0;min-height:100%;font-family:Arial,"Segoe UI",sans-serif;
 background:var(--bg);color:var(--text)
}
body{overflow-x:hidden}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

/* LOGIN */
#loginPage{
 min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:20px;position:relative;overflow:hidden;
 background:
 radial-gradient(circle at 15% 15%,#1677ff55,transparent 30%),
 radial-gradient(circle at 90% 85%,#00b8ff35,transparent 30%),
 linear-gradient(135deg,#020617,#07182d 55%,#102e52);
}
#loginPage:before,#loginPage:after{
 content:"";position:absolute;border-radius:50%;
 filter:blur(2px);border:1px solid #ffffff18;
 transform:rotate(25deg)
}
#loginPage:before{width:500px;height:500px;right:-200px;top:-180px}
#loginPage:after{width:350px;height:350px;left:-160px;bottom:-140px}

.login-box{
 width:100%;max-width:470px;padding:38px;border-radius:32px;
 background:rgba(255,255,255,.97);position:relative;z-index:2;
 box-shadow:0 35px 100px #0009;border:1px solid #ffffff;
}
.login-brand{text-align:center;margin-bottom:24px}
.login-logo{
 display:block;width:190px;height:190px;object-fit:contain;
 margin:0 auto 14px;border-radius:30px;
 filter:drop-shadow(0 18px 25px #07111f35);
}
.login-title{font-size:30px;font-weight:1000;letter-spacing:1px}
.login-sub{color:var(--muted);margin-top:7px;font-size:14px}
.login-language{
 position:absolute;top:18px;left:18px;padding:10px 14px;
 border-radius:14px;background:#eef5ff;color:#1261c9;font-weight:900
}
html[dir=ltr] .login-language{left:auto;right:18px}

label{
 display:block;font-size:14px;font-weight:900;margin:13px 0 7px
}
input,textarea,select{
 width:100%;padding:14px;border:1px solid var(--border);
 border-radius:14px;background:#fff;font-size:15px;
 outline:none;transition:.2s
}
input:focus,textarea:focus,select:focus{
 border-color:var(--primary);box-shadow:0 0 0 4px #1677ff18
}
.login-btn{
 width:100%;margin-top:18px;padding:15px;border-radius:15px;
 background:linear-gradient(135deg,var(--primary),var(--primary2));
 color:#fff;font-size:17px;font-weight:1000;
 box-shadow:0 12px 30px #1677ff45
}
.login-error{
 display:none;background:#fee2e2;color:#991b1b;
 padding:13px;border-radius:13px;font-weight:800
}

/* APP */
.sidebar{
 position:fixed;top:0;bottom:0;width:var(--sidebar);z-index:50;
 color:#fff;padding:18px 15px;display:flex;flex-direction:column;
 background:linear-gradient(160deg,#06101f,#0a1d35 55%,#0d3760);
 box-shadow:0 0 45px #0003;transition:.3s
}
html[dir=rtl] .sidebar{right:0}
html[dir=ltr] .sidebar{left:0}

.brand{
 display:flex;align-items:center;gap:12px;padding:5px 7px 18px;
 border-bottom:1px solid #ffffff18;margin-bottom:15px
}
.brand img{
 width:82px;height:82px;object-fit:contain;background:#fff;
 border-radius:20px;padding:5px;box-shadow:0 12px 25px #0004
}
.brand-text strong{display:block;font-size:18px}
.brand-text span{display:block;font-size:11px;opacity:.65;margin-top:4px}

.sidebar-user{
 padding:14px;border-radius:17px;background:#ffffff0d;
 border:1px solid #ffffff0c;margin-bottom:15px
}
.sidebar-user-name{font-weight:1000}
.sidebar-user-role{font-size:11px;opacity:.65;margin-top:4px}

.nav{display:flex;flex-direction:column;gap:7px}
.nav button{
 width:100%;display:flex;align-items:center;gap:12px;padding:13px;
 border-radius:14px;background:transparent;color:#dcecff;
 font-weight:900;text-align:start;transition:.2s
}
.nav button:hover{background:#ffffff10;transform:translateX(-2px)}
.nav button.active{
 background:linear-gradient(135deg,#1677ff,#00a9f5);
 box-shadow:0 10px 25px #1677ff35;color:#fff
}
.nav-icon{width:27px;text-align:center;font-size:20px}

.sidebar-bottom{
 margin-top:auto;border-top:1px solid #ffffff18;padding-top:14px
}
.language-btn,.logout{
 width:100%;padding:12px;border-radius:13px;font-weight:1000
}
.language-btn{background:#ffffff12;color:#fff;margin-bottom:8px}
.logout{background:#ef4444;color:#fff}

.designer{
 text-align:center;font-size:10px;opacity:.55;
 padding:12px 3px 4px;line-height:1.6
}

.main{min-height:100vh;padding:25px}
html[dir=rtl] .main{margin-right:var(--sidebar)}
html[dir=ltr] .main{margin-left:var(--sidebar)}

.topbar{
 display:flex;align-items:center;justify-content:space-between;
 gap:15px;margin-bottom:25px
}
.page-title h1{margin:0;font-size:30px;font-weight:1000}
.page-title p{margin:6px 0 0;color:var(--muted);font-size:13px}
.mobile-menu{
 display:none;padding:11px 14px;border-radius:13px;background:#fff;
 box-shadow:0 4px 15px #0001;font-size:20px
}
.topbar-actions{display:flex;align-items:center;gap:9px}
.top-language,.top-user{
 padding:11px 14px;border-radius:13px;background:#fff;
 font-weight:900;box-shadow:0 4px 18px #0000000b
}

/* CARDS */
.stats{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:16px;margin-bottom:20px
}
.stat{
 background:#fff;border:1px solid #e5ebf3;border-radius:22px;
 padding:21px;box-shadow:0 10px 30px #13233d0b;
 position:relative;overflow:hidden;transition:.25s
}
.stat:hover{
 transform:translateY(-4px);box-shadow:0 18px 35px #13233d18
}
.stat:after{
 content:"";position:absolute;width:100px;height:100px;
 border-radius:50%;background:#1677ff0b;left:-25px;top:-35px
}
.stat-title{font-size:13px;color:var(--muted);font-weight:800}
.stat-number{font-size:34px;font-weight:1000;margin-top:8px}

.panel{
 background:#fff;border-radius:23px;padding:21px;margin-bottom:20px;
 box-shadow:0 10px 30px #13233d0b;border:1px solid #e5ebf3
}
.panel-head{
 display:flex;align-items:center;justify-content:space-between;
 gap:10px;margin-bottom:18px
}
.panel h2{margin:0;font-size:20px;font-weight:1000}

/* BUTTONS */
.btn{
 padding:10px 14px;border-radius:12px;font-weight:1000;transition:.2s
}
.btn:hover{transform:translateY(-2px)}
.primary{
 background:linear-gradient(135deg,#1677ff,#00a9f5);color:#fff
}
.success{background:#10b981;color:#fff}
.danger{background:#ef4444;color:#fff}
.secondary{background:#edf2f7;color:#172033}
.actions{
 display:flex;gap:7px;flex-wrap:wrap;margin-top:13px
}

/* SEARCH */
.search-box{position:relative;margin-bottom:18px}
.search-box input{padding-right:45px}
html[dir=ltr] .search-box input{
 padding-right:14px;padding-left:45px
}
.search-icon{
 position:absolute;top:13px;right:15px;font-size:18px
}
html[dir=ltr] .search-icon{
 right:auto;left:15px
}

/* ORDERS */
.order-list{display:grid;gap:13px}
.order{
 border:1px solid var(--border);border-radius:18px;
 padding:17px;background:#fff;transition:.2s
}
.order:hover{
 box-shadow:0 12px 30px #0000000d;transform:translateY(-2px)
}
.order.urgent{
 border:2px solid #ef4444;background:#fff8f8
}
.order-head{
 display:flex;align-items:center;justify-content:space-between;
 gap:10px
}
.order-number{font-size:19px;font-weight:1000}
.customer{margin-top:6px;font-weight:900}
.info{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:9px;margin-top:13px
}
.info-box{
 background:#f5f8fc;border-radius:12px;
 padding:10px;font-size:12px;color:var(--muted)
}
.info-box b{
 display:block;margin-top:5px;font-size:13px;color:var(--text)
}
.badge{
 display:inline-flex;align-items:center;padding:6px 10px;
 border-radius:999px;background:#eaf3ff;color:#1556a8;
 font-size:12px;font-weight:1000
}
.overdue{background:#ffe5e5;color:#a61b1b}

/* MODALS */
.modal{
 position:fixed;inset:0;background:#02061799;display:flex;
 align-items:center;justify-content:center;padding:15px;
 z-index:100;backdrop-filter:blur(7px)
}
.modal-box{
 background:#fff;width:100%;max-width:620px;
 max-height:90vh;overflow:auto;border-radius:24px;
 padding:23px;box-shadow:0 30px 90px #0009
}
.modal-head{
 display:flex;align-items:center;justify-content:space-between;
 margin-bottom:15px
}
.modal-head h2{margin:0}
.close{
 background:#edf2f7;font-size:22px;
 padding:5px 12px;border-radius:10px
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{
 display:flex;align-items:center;gap:8px;
 font-weight:900;margin:13px 0
}
.check input{width:auto}

.empty{
 text-align:center;padding:35px 15px;
 color:var(--muted);font-weight:800
}
.message{
 position:fixed;bottom:20px;left:20px;right:20px;
 max-width:500px;margin:auto;padding:14px;border-radius:14px;
 background:#10b981;color:#fff;font-weight:1000;
 text-align:center;display:none;z-index:200;
 box-shadow:0 10px 30px #0003
}
.whatsapp{
 position:fixed;bottom:24px;z-index:80;width:58px;height:58px;
 border-radius:50%;background:#25d366;color:#fff;
 display:flex;align-items:center;justify-content:center;
 font-size:29px;box-shadow:0 10px 30px #0004;transition:.25s
}
.whatsapp:hover{transform:scale(1.1) rotate(-5deg)}
html[dir=rtl] .whatsapp{left:25px}
html[dir=ltr] .whatsapp{right:25px}

/* MOBILE */
@media(max-width:900px){
 :root{--sidebar:0px}
 .sidebar{
  width:285px;transform:translateX(110%)
 }
 html[dir=ltr] .sidebar{transform:translateX(-110%)}
 .sidebar.open{transform:translateX(0)!important}
 .main,html[dir=rtl] .main,html[dir=ltr] .main{
  margin:0;padding:14px
 }
 .mobile-menu{display:block}
 .stats{grid-template-columns:repeat(2,1fr)}
 .top-user{display:none}
}
@media(max-width:600px){
 .topbar{align-items:flex-start}
 .page-title h1{font-size:22px}
 .stats{gap:9px}
 .stat{padding:14px;border-radius:17px}
 .stat-number{font-size:26px}
 .panel{padding:14px;border-radius:18px}
 .info{grid-template-columns:1fr 1fr}
 .row{grid-template-columns:1fr}
 .login-box{padding:30px 20px}
 .login-logo{width:150px;height:150px}
 .login-title{font-size:24px}
}
@media(max-width:380px){
 .stats{grid-template-columns:1fr}
 .info{grid-template-columns:1fr}
}
</style>
</head>

/* =========================================================
   REFRESH SESSION
   ========================================================= */

async function refreshSession(){

 const refreshToken=
 localStorage.getItem(
   "supabase_refresh_token"
 );

 if(!refreshToken){
   throw new Error("لا يوجد Refresh Token");
 }


 /*
  * منع أكثر من Refresh في نفس اللحظة
  */
 if(refreshPromise){
   return refreshPromise;
 }


 refreshPromise=(async()=>{

   const response=await fetch(
     SUPABASE_URL+
     "/auth/v1/token?grant_type=refresh_token",
     {
       method:"POST",
       headers:{
         "apikey":SUPABASE_KEY,
         "Content-Type":"application/json"
       },
       body:JSON.stringify({
         refresh_token:refreshToken
       })
     }
   );


   const text=await response.text();

   let data={};

   try{
     data=text?JSON.parse(text):{};
   }catch{
     data={message:text};
   }


   if(!response.ok){

     throw new Error(
       data.error_description||
       data.msg||
       data.message||
       "انتهت جلسة الدخول"
     );

   }


   if(!data.access_token){

     throw new Error(
       "لم يتم تجديد جلسة الدخول"
     );

   }


   localStorage.setItem(
     "supabase_access_token",
     data.access_token
   );


   if(data.refresh_token){

     localStorage.setItem(
       "supabase_refresh_token",
       data.refresh_token
     );

   }


   if(data.expires_in){

     localStorage.setItem(
       "supabase_expires_in",
       String(data.expires_in)
     );

   }


   if(data.expires_at){

     localStorage.setItem(
       "supabase_expires_at",
       String(data.expires_at)
     );

   }


   return data;

 })();


 try{

   return await refreshPromise;

 }finally{

   refreshPromise=null;

 }

}


/* =========================================================
   API REQUEST
   ========================================================= */

async function request(
 path,
 method="GET",
 body=null,
 retry=true
){

 let token=
 localStorage.getItem(
   "supabase_access_token"
 );


 const headers={
   "apikey":SUPABASE_KEY,
   "Content-Type":"application/json",
   "Prefer":"return=representation"
 };


 if(token){

   headers["Authorization"]=
   "Bearer "+token;

 }else{

   headers["Authorization"]=
   "Bearer "+SUPABASE_KEY;

 }


 let response;


 try{

   response=await fetch(
     SUPABASE_URL+path,
     {
       method,
       headers,
       body:
         body!==null
         ?JSON.stringify(body)
         :undefined
     }
   );

 }catch(error){

   throw new Error(
     "تعذر الاتصال بالخادم. تحقق من الإنترنت."
   );

 }


 const text=await response.text();

 let data;

 try{

   data=text?JSON.parse(text):null;

 }catch{

   data=text;

 }


 /*
  * JWT EXPIRED
  *
  * إذا أعاد Supabase 401:
  * 1. نعمل Refresh
  * 2. نحصل على Access Token جديد
  * 3. نعيد نفس الطلب
  */

 if(
   !response.ok &&
   response.status===401 &&
   retry
 ){

   try{

     await refreshSession();

     return await request(
       path,
       method,
       body,
       false
     );

   }catch(refreshError){

     console.error(
       "Session refresh failed:",
       refreshError
     );

     localStorage.removeItem(
       "supabase_access_token"
     );

     localStorage.removeItem(
       "supabase_refresh_token"
     );

     localStorage.removeItem(
       "supabase_expires_at"
     );

     localStorage.removeItem(
       "supabase_expires_in"
     );

     throw new Error(
       "انتهت جلسة الدخول، يرجى تسجيل الدخول من جديد"
     );

   }

 }


 if(!response.ok){

   throw new Error(
     typeof data==="object"&&data
       ?(
         data.message||
         data.error_description||
         data.error||
         data.hint||
         JSON.stringify(data)
       )
       :(data||"HTTP "+response.status)
   );

 }


 return data;

}

   throw new Error(
     data.error_description||
     data.msg||
     data.message||

   );

 }


 return data;

}

/* =========================================================
   DELETE ORDER
   ========================================================= */

async function deleteOrder(id){

 if(role!=="المدير")
   return;


 const o=
 orders
 .map(norm)
 .find(
   x=>String(x.id)===String(id)
 );


 if(!o)
   return;


 if(!confirm(
   currentLanguage==="he"
   ?"למחוק את ההזמנה?"
   :"هل تريد حذف الطلبية؟"
 ))return;


 try{

   await request(
     "/rest/v1/orders?id=eq."+
     encodeURIComponent(id),
     "DELETE"
   );


   await loadOrders();


   msg(
     currentLanguage==="he"
     ?"🗑️ נמחקה"
     :"🗑️ تم حذف الطلبية"
   );


 }catch(e){

   alert(
     "❌ "+e.message
   );

 }

}


/* =========================================================
   NEXT STAGE
   ========================================================= */

async function nextStage(id){

 const o=
 orders
 .map(norm)
 .find(
   x=>String(x.id)===String(id)
 );


 if(!o)
   return;


 const next=o.stage+1;


 if(next>=stages.length)
   return;


 if(
   role!=="المدير"&&
   stages[next][1]!==role
 ){

   alert(
     currentLanguage==="he"
     ?"אין לך הרשאה לשלב זה"
     :"هذه المرحلة ليست ضمن صلاحيات قسمك"
   );

   return;

 }


 try{

   await request(
     "/rest/v1/orders?id=eq."+
     encodeURIComponent(id),
     "PATCH",
     {
       stage:next,
       updated_at:
       new Date().toISOString()
     }
   );


   await loadOrders();


   msg(
     currentLanguage==="he"
     ?"✅ עודכן"
     :"✅ تم تحديث المرحلة"
   );


 }catch(e){

   alert(
     "❌ "+e.message
   );

 }

}

/* =========================================================

function translateStage(v){

   "تم الكنت":"בוצע קנטים",

   "تم التركيب":"בוצעה הרכבה",
   "تم الدهان":"בוצע צבע",
   "تم التغليف":"בוצעה אריזה",
   "تم التحميل":"בוצעה העמסה",
   "تم التسليم":"נמסר"

 }[v]||v;

}


function translateRole(v){

 return{

   "المدير":"מנהל",
   "القص":"חיתוך",
   "الكنت":"קנטים",
   "CNC":"CNC",
   "التركيب":"הרכבה",

   "التغليف":"אריזה",
   "التحميل":"העמסה",
   "التسليم":"מסירה"

 }[v]||v;

}


/* =========================================================
   ORDER HTML
   ========================================================= */

function orderHtml(o){

 const he=
 currentLanguage==="he";


 const st=
 stages[o.stage];


 const stageName=
 st?.[0]||
 (he?"בטיפול":"في العمل");


 const department=
 st?.[1]||"-";


 let next="";


 if(
   o.stage<
   stages.length-1
 ){

   const dep=
   stages[o.stage+1][1];


   next=
   `<button class="btn primary"
   onclick="nextStage('${o.id}')">
   ➡️ ${
     he
     ?"בוצע "
     :"تم "
   }${
     esc(
       he
       ?translateRole(dep)
       :dep
     )
   }
   </button>`;

 }else{

   next=
   `<span class="badge">
   ✅ ${
     he
     ?"הושלם"
     :"مكتملة"
   }
   </span>`;

 }


 return`

 <div class="order ${
   o.urgent?"urgent":""
 }">

 <div class="order-head">

 <div>

 <div class="order-number">
 ${
   o.urgent?"⭐ ":""
 }#${esc(o.num)}
 </div>

 <div class="customer">
 ${esc(o.customer)}
 </div>

 </div>

 <span class="badge ${
   overdue(o)?"overdue":""
 }">

 ${
   overdue(o)
   ?(
      he
      ?"באיחור"
      :"متأخرة"
    )
   :esc(
      he
      ?translateStage(stageName)
      :stageName
    )
 }

 </span>

 </div>


 <div class="info">

 <div class="info-box">
 📞 ${he?"טלפון":"الهاتف"}
 <b>${esc(o.phone||"-")}</b>
 </div>

 <div class="info-box">
 📅 ${he?"מסירה":"التسليم"}
 <b>${esc(o.due||"-")}</b>
 </div>

 <div class="info-box">
 🏭 ${he?"מחלקה":"القسم"}
 <b>${esc(
   he
   ?translateRole(department)

 )}</b>
 </div>

 </div>


 <div class="actions">

 <button class="btn secondary"
 onclick="details('${o.id}')">

 📋 ${
   he
   ?"פרטים"
   :"التفاصيل"
 }

 </button>


 ${
 role==="المدير"
 ?`

 <button class="btn success"
 onclick="editOrder('${o.id}')">
 ✏️ ${
   he
   ?"עריכה"
   :"تعديل"

 </button>

 onclick="deleteOrder('${o.id}')">

   ?"מחיקה"
   :"حذف"

 `
 :""
 }

 </div>

 </div>

 `;

}

/* =========================================================
   CREATE USER
   ========================================================= */

document
.getElementById("userForm")
.addEventListener(
 "submit",
 async e=>{

   e.preventDefault();


   if(role!=="المدير")
     return;


   const username=
   document.getElementById(
     "newUsername"
   ).value.trim();


   const fullName=
   document.getElementById(
     "newFullName"
   ).value.trim();


   const email=
   document.getElementById(
     "newEmail"
   ).value.trim();


   const password=
   document.getElementById(
     "newPassword"
   ).value;


   const userRole=
   document.getElementById(
     "newRole"
   ).value;


   const active=
   document.getElementById(
     "newActive"
   ).checked;


   try{

     const token=
     localStorage.getItem(
       "supabase_access_token"
     );


     if(!token){

       throw new Error(
         "انتهت جلسة الدخول"
       );

     }


     /*
      * rapid-function
      * لا يتم وضع service_role هنا
      */

     const response=
     await fetch(
       CREATE_USER_FUNCTION,
       {
         method:"POST",

         headers:{
           "Content-Type":
           "application/json",

           "Authorization":
           "Bearer "+token,

           "apikey":
           SUPABASE_KEY
         },

         body:JSON.stringify({

           username,
           full_name:fullName,
           email,
           password,
           role:userRole,
           active

         })

       }
     );


     const text=
     await response.text();


     let data;


     try{

       data=
       text
       ?JSON.parse(text)
       :{};

     }catch{

       data={
         message:text
       };

     }


     /*
      * إذا كان JWT منتهي:
      * نعمل Refresh ثم نعيد الطلب مرة واحدة
      */

     if(
       response.status===401
     ){

       await refreshSession();


       const newToken=
       localStorage.getItem(
         "supabase_access_token"
       );


       const retryResponse=
       await fetch(
         CREATE_USER_FUNCTION,
         {
           method:"POST",

           headers:{
             "Content-Type":
             "application/json",

             "Authorization":
             "Bearer "+newToken,

             "apikey":
             SUPABASE_KEY
           },

           body:JSON.stringify({

             username,
             full_name:fullName,
             email,
             password,
             role:userRole,
             active

           })

         }
       );


       const retryText=
       await retryResponse.text();


       try{

         data=
         retryText
         ?JSON.parse(retryText)
         :{};

       }catch{

         data={
           message:retryText
         };

       }


       if(!retryResponse.ok){

         throw new Error(
           data.message||
           data.error||
           data.error_description||
           "فشل إنشاء المستخدم"
         );

       }


     }else if(!response.ok){

       throw new Error(
         data.message||
         data.error||
         data.error_description||
         "فشل إنشاء المستخدم"
       );

     }


     closeUserModal();


     await loadUsers();


     msg(
       currentLanguage==="he"
       ?"✅ המשתמש נוצר בהצלחה"
       :"✅ تم إنشاء المستخدم بنجاح"
     );


   }catch(err){

     console.error(
       "create user:",
       err
     );


     alert(
       "❌ "+err.message
     );

   }

 }
);
