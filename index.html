<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<link rel="manifest" href="manifest.webmanifest">
<title>MODULAR TECH</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --sidebar:300px;
  --navy:#07111f;
  --navy2:#0d1b2d;
  --blue:#2477ff;
  --blue2:#155eef;
  --green:#159947;
  --red:#d92d20;
  --orange:#e67e22;
  --bg:#f4f7fb;
  --text:#142033;
  --muted:#697586;
  --border:#e3e8ef;
  --white:#fff;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

.login{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:
    radial-gradient(circle at top right,#1e4f85 0,#0b1b2d 35%,#040b14 100%);
}

.login-box{
  width:100%;
  max-width:440px;
  background:rgba(255,255,255,.98);
  border-radius:28px;
  padding:34px;
  box-shadow:
    0 30px 90px rgba(0,0,0,.35),
    0 4px 20px rgba(0,0,0,.08);
}

.login-logo{
  text-align:center;
  font-size:31px;
  font-weight:900;
  letter-spacing:.5px;
  color:#102a43;
}

.login-sub{
  text-align:center;
  color:var(--muted);
  font-size:15px;
  font-weight:600;
  margin-top:8px;
  margin-bottom:28px;
}

label{
  display:block;
  font-size:15px;
  font-weight:800;
  margin:12px 0 7px;
}

input,
textarea,
select{
  width:100%;
  padding:14px 15px;
  border:1px solid #d5dde8;
  border-radius:13px;
  outline:none;
  background:#fff;
  color:var(--text);
  font-size:16px;
  transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(36,119,255,.12);
}

textarea{
  resize:vertical;
}

.login-btn{
  width:100%;
  margin-top:12px;
  padding:15px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;
  font-size:17px;
  font-weight:900;
  box-shadow:0 8px 22px rgba(36,119,255,.25);
}

.login-btn:active{
  transform:scale(.98);
}

.error{
  background:#fff0f0;
  color:#a61b1b;
  border:1px solid #ffd1d1;
  padding:13px;
  border-radius:12px;
  margin-bottom:14px;
  font-weight:800;
}

/* =========================
   APP LAYOUT
========================= */

#app{
  min-height:100vh;
  min-height:100dvh;
}

.app-layout{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  position:fixed;
  top:0;
  bottom:0;
  right:0;
  width:var(--sidebar);
  z-index:50;
  padding:22px 18px;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(
      160deg,
      #07111f 0%,
      #0b1727 50%,
      #0d1e33 100%
    );
  color:#fff;
  box-shadow:-8px 0 30px rgba(0,0,0,.16);
}

.brand{
  padding:8px 8px 24px;
  border-bottom:1px solid rgba(255,255,255,.09);
}

.brand-title{
  font-size:25px;
  font-weight:950;
  letter-spacing:.5px;
}

.brand-sub{
  margin-top:5px;
  color:#aab8c9;
  font-size:14px;
  font-weight:600;
}

.sidebar-user{
  margin-top:18px;
  padding:15px;
  border-radius:17px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
}

.user-name{
  font-size:16px;
  font-weight:900;
}

.user-role{
  color:#9fb0c5;
  font-size:13px;
  font-weight:700;
  margin-top:4px;
}

.nav-title{
  color:#71849c;
  font-size:12px;
  font-weight:900;
  margin:24px 9px 10px;
  letter-spacing:.5px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.nav button{
  width:100%;
  min-height:58px;
  display:flex;
  align-items:center;
  gap:13px;
  padding:13px 15px;
  border-radius:15px;
  background:transparent;
  color:#dce6f3;
  text-align:right;
  font-size:17px;
  font-weight:900;
  transition:.2s;
}

.nav button:hover{
  background:rgba(255,255,255,.08);
}

.nav button.active{
  background:
    linear-gradient(
      135deg,
      #2477ff,
      #155eef
    );
  color:#fff;
  box-shadow:0 8px 22px rgba(36,119,255,.22);
}

.nav-icon{
  width:35px;
  height:35px;
  min-width:35px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  background:rgba(255,255,255,.08);
  font-size:21px;
}

.nav button.active .nav-icon{
  background:rgba(255,255,255,.18);
}

.sidebar-bottom{
  margin-top:auto;
}

.logout{
  width:100%;
  min-height:52px;
  border-radius:14px;
  background:rgba(217,45,32,.13);
  color:#ffb4ad;
  font-size:16px;
  font-weight:900;
}

/* =========================
   MAIN
========================= */

.main{
  width:calc(100% - var(--sidebar));
  margin-right:var(--sidebar);
  min-height:100vh;
  min-height:100dvh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  height:74px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 26px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

.page-title{
  font-size:23px;
  font-weight:950;
}

.mobile-menu{
  display:none;
  width:45px;
  height:45px;
  border-radius:12px;
  background:#eef3f9;
  font-size:22px;
}

.content{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

/* =========================
   BUTTONS
========================= */

.btn{
  min-height:44px;
  padding:10px 15px;
  border-radius:11px;
  font-size:14px;
  font-weight:900;
}

.primary{
  background:var(--blue);
  color:#fff;
}

.primary:hover{
  background:var(--blue2);
}

.success{
  background:var(--green);
  color:#fff;
}

.danger{
  background:var(--red);
  color:#fff;
}

.secondary{
  background:#eaf0f7;
  color:#172033;
}

.btn:active{
  transform:scale(.98);
}

/* =========================
   DASHBOARD
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.stat{
  background:#fff;
  border:1px solid var(--border);
  border-radius:19px;
  padding:19px;
  box-shadow:0 5px 20px rgba(16,32,51,.05);
}

.stat-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.stat-icon{
  width:46px;
  height:46px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#edf4ff;
  font-size:23px;
}

.stat-label{
  color:var(--muted);
  font-size:14px;
  font-weight:800;
}

.stat-number{
  margin-top:10px;
  font-size:32px;
  line-height:1;
  font-weight:950;
}

/* =========================
   PANELS
========================= */

.panel{
  margin-top:18px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 20px rgba(16,32,51,.05);
}

.panel-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}

.panel-title{
  margin:0;
  font-size:21px;
  font-weight:950;
}

.list{
  display:grid;
  gap:12px;
}

/* =========================
   ORDER
========================= */

.order{
  border:1px solid var(--border);
  border-radius:17px;
  padding:17px;
  background:#fff;
  transition:.2s;
}

.order:hover{
  box-shadow:0 8px 25px rgba(16,32,51,.07);
}

.order.urgent{
  border:2px solid #ef7770;
  background:#fff8f7;
}

.order-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
}

.order-number{
  font-size:17px;
  font-weight:950;
}

.customer-name{
  margin-top:5px;
  font-size:16px;
  font-weight:800;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:31px;
  padding:5px 11px;
  border-radius:999px;
  background:#eaf2ff;
  color:#1556a8;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}

.badge.overdue{
  background:#ffe8e8;
  color:#a61b1b;
}

.badge.complete{
  background:#e5f7eb;
  color:#08752d;
}

.order-info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:13px;
}

.info-box{
  background:#f6f8fb;
  border-radius:11px;
  padding:10px;
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}

.info-box strong{
  display:block;
  margin-top:4px;
  color:var(--text);
  font-size:14px;
  font-weight:900;
}

.notes{
  margin-top:10px;
  padding:10px 12px;
  border-radius:11px;
  background:#fafbfc;
  color:#596579;
  font-size:13px;
  line-height:1.7;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:13px;
}

/* =========================
   PRODUCTION
========================= */

.stage{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
}

.stage-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.stage-title{
  font-size:17px;
  font-weight:950;
}

.stage-count{
  padding:6px 11px;
  border-radius:999px;
  background:#edf4ff;
  color:#1556a8;
  font-size:12px;
  font-weight:900;
}

/* =========================
   SEARCH
========================= */

.search-box{
  position:relative;
  margin-bottom:15px;
}

.search-box input{
  padding-right:48px;
  min-height:50px;
}

.search-icon{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  font-size:21px;
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
  font-weight:700;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(5px);
}

.modal-box{
  width:100%;
  max-width:620px;
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:22px;
  padding:22px;
  box-shadow:0 30px 90px rgba(0,0,0,.3);
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.modal-title{
  margin:0;
  font-size:21px;
  font-weight:950;
}

.close{
  width:42px;
  height:42px;
  border-radius:12px;
  background:#edf1f6;
  font-size:25px;
  line-height:1;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:20px;
  right:20px;
  bottom:22px;
  z-index:200;
  max-width:520px;
  margin:auto;
  padding:14px 17px;
  border-radius:13px;
  background:#132238;
  color:#fff;
  text-align:center;
  font-size:15px;
  font-weight:900;
  box-shadow:0 12px 30px rgba(0,0,0,.22);
  display:none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:950px){

  :root{
    --sidebar:270px;
  }

  .sidebar{
    transform:translateX(100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    width:100%;
    margin-right:0;
  }

  .mobile-menu{
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .topbar{
    padding:0 15px;
  }

  .content{
    padding:15px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:600px){

  .login{
    padding:15px;
  }

  .login-box{
    padding:25px 20px;
    border-radius:23px;
  }

  .login-logo{
    font-size:27px;
  }

  .topbar{
    height:66px;
  }

  .page-title{
    font-size:18px;
  }

  .content{
    padding:11px;
  }

  .panel{
    padding:14px;
    border-radius:17px;
  }

  .panel-title{
    font-size:18px;
  }

  .stats{
    gap:8px;
  }

  .stat{
    padding:13px;
    border-radius:15px;
  }

  .stat-icon{
    width:38px;
    height:38px;
    border-radius:11px;
    font-size:19px;
  }

  .stat-label{
    font-size:12px;
  }

  .stat-number{
    font-size:25px;
  }

  .order{
    padding:13px;
  }

  .order-info{
    grid-template-columns:1fr 1fr;
  }

  .order-head{
    align-items:flex-start;
  }

  .actions .btn{
    flex:1;
    min-width:110px;
  }

  .modal{
    padding:10px;
    align-items:flex-end;
  }

  .modal-box{
    max-height:94vh;
    border-radius:21px 21px 0 0;
    padding:18px;
  }
}

@media(max-width:380px){

  .stats{
    grid-template-columns:1fr;
  }

  .order-info{
    grid-template-columns:1fr;
  }

  .nav button{
    font-size:16px;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginPage" class="login">

  <div class="login-box">

    <div class="login-logo">
      MODULAR TECH
    </div>

    <div class="login-sub">
      نظام إدارة الطلبيات
    </div>

    <div id="loginError" class="error hidden"></div>

    <label for="loginUsername">
      اسم المستخدم
    </label>

    <input
      id="loginUsername"
      autocomplete="username"
      placeholder="admin"
    >

    <label for="loginPassword">
      كلمة المرور
    </label>

    <input
      id="loginPassword"
      type="password"
      autocomplete="current-password"
      placeholder="كلمة المرور"
    >

    <button
      class="login-btn"
      onclick="login()"
    >
      🔐 تسجيل الدخول
    </button>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="hidden">

  <div class="app-layout">

    <!-- SIDEBAR -->

    <aside id="sidebar" class="sidebar">

      <div class="brand">
        <div class="brand-title">
          MODULAR TECH
        </div>

        <div class="brand-sub">
          نظام إدارة الطلبيات
        </div>
      </div>

      <div class="sidebar-user">

        <div id="sidebarUserName" class="user-name">
          -
        </div>

        <div id="sidebarUserRole" class="user-role">
          -
        </div>

      </div>

      <div class="nav-title">
        القائمة الرئيسية
      </div>

      <nav class="nav">

        <button
          id="navDashboard"
          class="active"
          onclick="show('dashboard',this,'الرئيسية')"
        >
          <span class="nav-icon">⌂</span>
          <span>الرئيسية</span>
        </button>

        <button
          id="navOrders"
          onclick="show('ordersSection',this,'الطلبيات')"
        >
          <span class="nav-icon">▤</span>
          <span>الطلبيات</span>
        </button>

        <button
          id="navProduction"
          onclick="show('production',this,'مراحل العمل')"
        >
          <span class="nav-icon">⚙</span>
          <span>مراحل العمل</span>
        </button>

        <button
          id="usersNav"
          onclick="show('users',this,'المستخدمون')"
        >
          <span class="nav-icon">♙</span>
          <span>المستخدمون</span>
        </button>

      </nav>

      <div class="sidebar-bottom">

        <button
          class="logout"
          onclick="logout()"
        >
          🚪 تسجيل الخروج
        </button>

      </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

      <header class="topbar">

        <button
          class="mobile-menu"
          onclick="toggleSidebar()"
          aria-label="القائمة"
        >
          ☰
        </button>

        <div id="pageTitle" class="page-title">
          الرئيسية
        </div>

        <div></div>

      </header>


      <div class="content">

        <!-- =========================
             DASHBOARD
        ========================= -->

        <section id="dashboard">

          <div class="stats">

            <div class="stat">

              <div class="stat-top">

                <div>
                  <div class="stat-label">
                    إجمالي الطلبيات
                  </div>

                  <div id="total" class="stat-number">
                    0
                  </div>
                </div>

                <div class="stat-icon">
                  📋
                </div>

              </div>

            </div>


            <div class="stat">

              <div class="stat-top">

                <div>
                  <div class="stat-label">
                    قيد العمل
                  </div>

                  <div id="active" class="stat-number">
                    0
                  </div>
                </div>

                <div class="stat-icon">
                  ⚙️
                </div>

              </div>

            </div>


            <div class="stat">

              <div class="stat-top">

                <div>
                  <div class="stat-label">
                    مهمة جدًا
                  </div>

                  <div id="urgent" class="stat-number">
                    0
                  </div>
                </div>

                <div class="stat-icon">
                  ⭐
                </div>

              </div>

            </div>


            <div class="stat">

              <div class="stat-top">

                <div>
                  <div class="stat-label">
                    متأخرة
                  </div>

                  <div id="overdue" class="stat-number">
                    0
                  </div>
                </div>

                <div class="stat-icon">
                  ⚠️
                </div>

              </div>

            </div>

          </div>


          <div class="panel">

            <div class="panel-header">

              <h2 class="panel-title">
                📋 آخر الطلبيات
              </h2>

              <button
                class="btn primary adminOnly"
                onclick="openOrder()"
              >
                ➕ إضافة طلبية
              </button>

            </div>

            <div id="latest" class="list"></div>

          </div>

        </section>


        <!-- =========================
             ORDERS
        ========================= -->

        <section
          id="ordersSection"
          class="hidden"
        >

          <div class="panel">

            <div class="panel-header">

              <h2 class="panel-title">
                📋 إدارة الطلبيات
              </h2>

              <button
                class="btn primary adminOnly"
                onclick="openOrder()"
              >
                ➕ إضافة طلبية
              </button>

            </div>


            <div class="search-box">

              <span class="search-icon">
                🔎
              </span>

              <input
                id="search"
                placeholder="رقم الطلبية أو الزبون أو الهاتف"
                oninput="renderOrders()"
              >

            </div>


            <div
              id="orders"
              class="list"
            ></div>

          </div>

        </section>


        <!-- =========================
             PRODUCTION
        ========================= -->

        <section
          id="production"
          class="hidden"
        >

          <div class="panel">

            <div class="panel-header">

              <h2 class="panel-title">
                ⚙️ مراحل العمل
              </h2>

            </div>

            <div
              id="stages"
              class="list"
            ></div>

          </div>

        </section>


        <!-- =========================
             USERS
        ========================= -->

        <section
          id="users"
          class="hidden"
        >

          <div class="panel">

            <div class="panel-header">

              <h2 class="panel-title">
                👥 المستخدمون
              </h2>

            </div>

            <div id="usersList"></div>

          </div>

        </section>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const URL =
  "https://bvrfrcmblwzuqprjknam.supabase.co";

const KEY =
  "sb_publishable_vVXVJGcWpoPvPEH_bfm23Q_dZ5eXvmE";


/* =========================================================
   PRODUCTION STAGES
========================================================= */

const stages = [

  ["في العمل","المدير"],

  ["تم القص","القص"],

  ["تم الكنت","الكنت"],

  ["تم CNC","CNC"],

  ["تم التركيب","التركيب"],

  ["تم الدهان","الدهان"],

  ["تم التغليف","التغليف"],

  ["تم التحميل","التحميل"],

  ["تم التسليم","التسليم"]

];


let orders = [];
let profile = null;
let role = "";


/* =========================================================
   SUPABASE REQUEST
========================================================= */

async function req(
  table,
  method = "GET",
  body = null,
  query = ""
){

  const options = {

    method,

    headers:{
      apikey:KEY,
      Authorization:"Bearer " + KEY,
      "Content-Type":"application/json",
      Prefer:"return=representation"
    }

  };

  if(body !== null){
    options.body = JSON.stringify(body);
  }

  const response =
    await fetch(
      URL + "/rest/v1/" + table + query,
      options
    );

  const text =
    await response.text();

  let data;

  try{
    data = text ? JSON.parse(text) : null;
  }catch{
    data = text;
  }

  if(!response.ok){

    throw new Error(
      data?.message ||
      data?.error ||
      data?.hint ||
      String(data)
    );

  }

  return data;

}


/* =========================================================
   AUTH
========================================================= */

async function auth(endpoint,body){

  const response =
    await fetch(
      URL + "/auth/v1/" + endpoint,
      {
        method:"POST",
        headers:{
          apikey:KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify(body)
      }
    );

  const data =
    await response.json();

  if(!response.ok){

    throw new Error(
      data.error_description ||
      data.msg ||
      data.message ||
      "فشل تسجيل الدخول"
    );

  }

  return data;

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

  const element =
    document.getElementById("toast");

  element.textContent = message;
  element.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(
      ()=>{
        element.style.display = "none";
      },
      2800
    );

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const username =
    document.getElementById("loginUsername")
      .value
      .trim();

  const password =
    document.getElementById("loginPassword")
      .value;

  const error =
    document.getElementById("loginError");

  error.classList.add("hidden");

  if(!username || !password){

    error.textContent =
      "يرجى إدخال اسم المستخدم وكلمة المرور";

    error.classList.remove("hidden");

    return;

  }

  try{

    const result =
      await req(
        "rpc/get_login_email",
        "POST",
        {
          p_username:username
        }
      );

    let email =
      Array.isArray(result)
        ? result[0]
        : result;

    if(typeof email === "object"){

      email =
        email?.get_login_email ||
        email?.email;

    }

    if(!email){

      throw new Error(
        "اسم المستخدم غير موجود أو غير فعال"
      );

    }

    const session =
      await auth(
        "token?grant_type=password",
        {
          email,
          password
        }
      );

    localStorage.setItem(
      "access",
      session.access_token
    );

    localStorage.setItem(
      "refresh",
      session.refresh_token
    );

    await start(session.user.id);

    toast("✅ تم تسجيل الدخول");

  }catch(errorObject){

    error.textContent =
      "❌ " + errorObject.message;

    error.classList.remove("hidden");

  }

}


/* =========================================================
   START USER SESSION
========================================================= */

async function start(id){

  const data =
    await req(
      "profiles",
      "GET",
      null,
      "?select=id,username,full_name,role,active,email&id=eq."
      + encodeURIComponent(id)
      + "&limit=1"
    );

  if(!data || !data.length){

    throw new Error(
      "لم يتم العثور على ملف المستخدم"
    );

  }

  profile = data[0];

  if(!profile.active){

    throw new Error(
      "هذا الحساب غير فعال"
    );

  }

  role =
    profile.role || "";

  const displayName =
    profile.full_name ||
    profile.username ||
    "المستخدم";

  document.getElementById(
    "sidebarUserName"
  ).textContent =
    displayName;

  document.getElementById(
    "sidebarUserRole"
  ).textContent =
    role || "مستخدم";

  document.getElementById(
    "loginPage"
  ).classList.add("hidden");

  document.getElementById(
    "app"
  ).classList.remove("hidden");


  /*
    المستخدم غير المدير:
    إخفاء المستخدمين وأزرار الإدارة.
  */

  if(role !== "المدير"){

    document
      .getElementById("usersNav")
      .classList.add("hidden");

    document
      .querySelectorAll(".adminOnly")
      .forEach(
        element =>
          element.classList.add("hidden")
      );

  }


  await loadOrders();

  if(role === "المدير"){
    await loadUsers();
  }

}


/* =========================================================
   SESSION CHECK
========================================================= */

async function session(){

  const token =
    localStorage.getItem("access");

  if(!token){
    return;
  }

  try{

    const response =
      await fetch(
        URL + "/auth/v1/user",
        {
          headers:{
            apikey:KEY,
            Authorization:"Bearer " + token
          }
        }
      );

    if(!response.ok){
      throw new Error("انتهت الجلسة");
    }

    const user =
      await response.json();

    await start(user.id);

  }catch{

    logout();

  }

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

  localStorage.removeItem("access");
  localStorage.removeItem("refresh");

  location.reload();

}


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar(){

  document
    .getElementById("sidebar")
    .classList.toggle("open");

}


function closeSidebarMobile(){

  if(window.innerWidth <= 950){

    document
      .getElementById("sidebar")
      .classList.remove("open");

  }

}


/* =========================================================
   NAVIGATION
========================================================= */

function show(id,button,title){

  document
    .querySelectorAll(
      ".content > section"
    )
    .forEach(
      section =>
        section.classList.add("hidden")
    );

  const target =

  if(target){
    target.classList.remove("hidden");
  }

    .querySelectorAll(".nav button")
    .forEach(

        item.classList.remove("active")
    );

    button.classList.add("active");
  }

  document.getElementById(
    "pageTitle"
  ).textContent =
    title || "MODULAR TECH";

/* =========================================================
   NORMALIZE ORDER
========================================================= */

function norm(order){

  return {

    id:order.id,

    num:
      order.order_number || "",

    customer:
      order.customer_name || "",

    phone:
      order.phone || "",

    due:
      order.due_date || "",

    notes:
      order.notes || "",

    urgent:
      !!order.urgent,

    stage:
      Number(order.stage || 0)

  };

}


/* =========================================================
   OVERDUE
========================================================= */

function isOverdue(order){

  return (
    order.due &&
    new Date(
      order.due + "T23:59:59"
    ) < new Date() &&
    order.stage < stages.length - 1
  );

}


/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders(){

  orders =
    await req(
      "orders",
      "GET",
      null,
      "?select=id,order_number,customer_name,phone,due_date,notes,urgent,stage,created_at,updated_at&order=created_at.desc"
    );

  orders =
    orders || [];

  renderAll();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    character =>
      ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[character])
  );

}


/* =========================================================
   ORDER CARD
========================================================= */

function card(order,buttons=true){

  const stage =
    stages[order.stage] ||
    stages[0];

  const overdue =
    isOverdue(order);

  const nextStage =
    stages[order.stage + 1];


  return `

    <div class="order ${order.urgent ? "urgent" : ""}">

      <div class="order-head">

        <div>

          <div class="order-number">
            #${esc(order.num)}
          </div>

          <div class="customer-name">
            ${esc(order.customer)}
          </div>

        </div>


        <span class="badge ${overdue ? "overdue" : ""}">

          ${
            overdue
              ? "متأخرة"
              : esc(stage[0])
          }

        </span>

      </div>


      <div class="order-info">

        <div class="info-box">
          📞 الهاتف
          <strong>
            ${esc(order.phone || "-")}
          </strong>
        </div>


        <div class="info-box">
          📅 التسليم
          <strong>
            ${esc(order.due || "-")}
          </strong>
        </div>


        <div class="info-box">
          🏭 القسم
          <strong>
            ${esc(stage[1] || "-")}
          </strong>
        </div>

      </div>


      ${
        order.notes
          ? `
            <div class="notes">
              📝 ${esc(order.notes)}
            </div>
          `
          : ""
      }


      ${
        buttons
          ? `

            <div class="actions">

              <button
                class="btn secondary"
                onclick="details('${order.id}')"
              >
                📋 التفاصيل
              </button>


              ${
                role === "المدير"
                  ? `

                    <button
                      class="btn success"
                      onclick="editOrder('${order.id}')"
                    >
                      ✏️ تعديل
                    </button>

                    <button
                      class="btn danger"
                      onclick="delOrder('${order.id}')"
                    >
                      🗑️ حذف
                    </button>

                  `
                  : ""
              }


              ${
                order.stage < stages.length - 1
                  ? `

                    <button
                      class="btn primary"
                      onclick="nextStage('${order.id}')"
                    >
                      ➡️ تم ${esc(nextStage[1])}
                    </button>

                  `
                  : `

                    <span class="badge complete">
                      ✅ مكتملة
                    </span>

                  `
              }

            </div>

          `
          : ""
      }

    </div>

  `;

}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll(){

  renderDashboard();
  renderOrders();
  renderStages();

}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard(){

  const list =
    orders.map(norm);

  document.getElementById(
    "total"
  ).textContent =
    list.length;

  document.getElementById(
    "active"
  ).textContent =
    list.filter(
      order =>
        order.stage < stages.length - 1
    ).length;

  document.getElementById(
    "urgent"
  ).textContent =
    list.filter(
      order =>
        order.urgent
    ).length;

  document.getElementById(
    "overdue"
  ).textContent =
    list.filter(
      order =>
        isOverdue(order)
    ).length;


  document.getElementById(
    "latest"
  ).innerHTML =

    list
      .slice(0,5)
      .map(
        order =>
          card(order,false)
      )
      .join("")

    ||

    `
      <div class="empty">
        لا توجد طلبيات حتى الآن
      </div>
    `;

}


/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders(){

  const searchElement =
    document.getElementById("search");

  const query =
    (
      searchElement?.value ||
      ""
    )
    .toLowerCase()
    .trim();


  const filtered =
    orders
      .map(norm)
      .filter(order =>

        (
          order.num +
          " " +
          order.customer +
          " " +
          order.phone
        )
        .toLowerCase()
        .includes(query)

      );


  document.getElementById(
    "orders"
  ).innerHTML =

    filtered
      .map(order => card(order,true))
      .join("")

    ||

    `
      <div class="empty">
        لا توجد طلبيات مطابقة
      </div>
    `;

}


/* =========================================================
   RENDER STAGES
========================================================= */

function renderStages(){

  const element =
    document.getElementById("stages");


  element.innerHTML =

    stages
      .map(
        (stage,index) => {

          const stageOrders =
            orders
              .map(norm)
              .filter(
                order =>
                  order.stage === index
              );


          return `

            <div class="stage">

              <div class="stage-head">

                <div class="stage-title">
                  ${esc(stage[0])}
                </div>

                <div class="stage-count">
                  ${stageOrders.length} طلبية
                </div>

              </div>


              <div class="list">

                ${
                  stageOrders.length

                    ?

                    stageOrders
                      .map(
                        order =>
                          card(order,true)
                      )
                      .join("")

                    :

                    `
                      <div class="empty">
                        لا توجد طلبيات في هذه المرحلة
                      </div>
                    `
                }

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================================================
   OPEN ORDER
========================================================= */

function openOrder(id=null){

  if(role !== "المدير"){

    alert("ليس لديك صلاحية لإضافة أو تعديل الطلبيات");

    return;

  }


  const form =
    document.getElementById(
      "orderForm"
    );

  form.reset();


  document.getElementById(
    "editId"
  ).value = "";


  document.getElementById(
    "due"
  ).value =
    new Date()
      .toISOString()
      .slice(0,10);


  document.getElementById(
    "orderTitle"
  ).textContent =
    "➕ إضافة طلبية";


  if(id){

    const order =
      orders
        .map(norm)
        .find(
          item =>
            String(item.id) === String(id)
        );


    if(!order){
      return;
    }


    document.getElementById(
      "editId"
    ).value =
      order.id;


    document.getElementById(
      "orderNum"
    ).value =
      order.num;


    document.getElementById(
      "customer"
    ).value =
      order.customer;


    document.getElementById(
      "phone"
    ).value =
      order.phone;


    document.getElementById(
      "due"
    ).value =
      order.due;


    document.getElementById(
      "notes"
    ).value =
      order.notes;


    document.getElementById(
      "isUrgent"
    ).checked =
      order.urgent;


    document.getElementById(
      "orderTitle"
    ).textContent =
      "✏️ تعديل الطلبية #" +
      order.num;

  }


  document
    .getElementById("orderModal")
    .classList.remove("hidden");

}


/* =========================================================
   CLOSE ORDER
========================================================= */

function closeOrder(){

  document
    .getElementById("orderModal")
    .classList.add("hidden");

}


/* =========================================================
   SAVE ORDER
========================================================= */

document
  .getElementById("orderForm")
  .addEventListener(
    "submit",
    async function(event){

      event.preventDefault();


      try{

        const id =
          document.getElementById(
            "editId"
          ).value;


        const body = {

          order_number:
            document.getElementById(
              "orderNum"
            ).value.trim(),

          customer_name:
            document.getElementById(
              "customer"
            ).value.trim(),

          phone:
            document.getElementById(
              "phone"
            ).value.trim(),

          due_date:
            document.getElementById(
              "due"
            ).value,

          notes:
            document.getElementById(
              "notes"
            ).value.trim(),

          urgent:
            document.getElementById(
              "isUrgent"
            ).checked,

          updated_at:
            new Date().toISOString()

        };


        if(!body.order_number){

          alert("يرجى إدخال رقم الطلبية");

          return;

        }


        if(!body.customer_name){

          alert("يرجى إدخال اسم الزبون");

          return;

        }


        if(id){

          await req(
            "orders",
            "PATCH",
            body,
            "?id=eq." +
            encodeURIComponent(id)
          );

        }else{

          await req(
            "orders",
            "POST",
            {
              ...body,
              stage:0
            }
          );

        }


        closeOrder();

        await loadOrders();


        toast(
          id
            ? "✅ تم تعديل الطلبية وحفظها"
            : "✅ تم حفظ الطلبية بنجاح"
        );


      }catch(error){

        alert(
          "❌ فشل حفظ الطلبية\n\n" +
          error.message
        );

      }

    }
  );


/* =========================================================
   EDIT
========================================================= */

function editOrder(id){

  openOrder(id);

}


/* =========================================================
   DELETE
========================================================= */

async function delOrder(id){

  if(
    !confirm(
      "هل تريد حذف هذه الطلبية؟"
    )
  ){

    return;

  }


  try{

    await req(
      "orders",
      "DELETE",
      null,
      "?id=eq." +
      encodeURIComponent(id)
    );


    await loadOrders();

    toast("🗑️ تم حذف الطلبية");

  }catch(error){

    alert(
      "❌ فشل حذف الطلبية\n\n" +
      error.message
    );

  }

}


/* =========================================================
   NEXT STAGE
========================================================= */

async function nextStage(id){

  const order =
    orders
      .map(norm)
      .find(
        item =>
          String(item.id) === String(id)
      );


  if(!order){
    return;
  }


  const next =
    order.stage + 1;


  if(next >= stages.length){
    return;
  }


  /*
    المدير يستطيع نقل أي طلبية.

    الموظف يستطيع الانتقال للمرحلة
    التابعة لقسمه فقط.
  */

  if(
    role !== "المدير" &&
    stages[next][1] !== role
  ){

    alert(
      "هذه المرحلة ليست ضمن صلاحيات قسمك"
    );

    return;

  }


  try{

    await req(
      "orders",
      "PATCH",
      {
        stage:next,
        updated_at:
          new Date().toISOString()
      },
      "?id=eq." +
      encodeURIComponent(id)
    );


    await loadOrders();

    toast(
      "✅ تم تحديث الطلبية إلى: " +
      stages[next][0]
    );


  }catch(error){

    alert(
      "❌ فشل تحديث المرحلة\n\n" +
      error.message
    );

  }

}


/* =========================================================
   ORDER DETAILS
========================================================= */

function details(id){

  const order =
    orders
      .map(norm)
      .find(
        item =>
          String(item.id) === String(id)
      );


  if(!order){
    return;
  }


  const stage =
    stages[order.stage] ||
    stages[0];


  alert(

    "📋 تفاصيل الطلبية\n\n" +

    "رقم الطلبية: #" +
    order.num +

    "\n\nالزبون: " +
    order.customer +

    "\nالهاتف: " +
    (order.phone || "-") +

    "\nموعد التسليم: " +
    (order.due || "-") +

    "\n\nالحالة: " +
    stage[0] +

    "\nالقسم: " +
    stage[1] +

    "\n\nالملاحظات: " +
    (order.notes || "-")

  );

}


/* =========================================================
   USERS
========================================================= */

async function loadUsers(){

  const usersList =
    document.getElementById(
      "usersList"
    );


  try{

    const users =
      await req(
        "profiles",
        "GET",
        null,
        "?select=id,username,full_name,role,active,email&order=created_at.desc"
      );


    usersList.innerHTML =

      users
        .map(
          user => `

            <div class="order">

              <div class="order-head">

                <div>

                  <div class="order-number">
                    ${esc(
                      user.full_name ||
                      user.username
                    )}
                  </div>

                  <div class="customer-name">
                    @${esc(user.username)}
                  </div>

                </div>


                <span class="badge">
                  ${esc(user.role || "-")}
                </span>

              </div>


              <div class="order-info">

                <div class="info-box">
                  👤 الحالة

                  <strong>
                    ${
                      user.active
                        ? "فعال"
                        : "متوقف"
                    }
                  </strong>

                </div>


                <div class="info-box">
                  🏢 القسم

                  <strong>
                    ${esc(user.role || "-")}
                  </strong>

                </div>


                <div class="info-box">
                  ✉️ البريد

                  <strong>
                    ${esc(user.email || "-")}
                  </strong>

                </div>

              </div>

            </div>

          `
        )
        .join("")

      ||

      `
        <div class="empty">
          لا يوجد مستخدمون
        </div>
      `;


  }catch(error){

    usersList.innerHTML = `

      <div class="empty">
        تعذر تحميل المستخدمين
      </div>

    `;

  }

}


/* =========================================================
   CLOSE MODAL BY CLICKING OUTSIDE
========================================================= */

document
  .getElementById("orderModal")
  .addEventListener(
    "click",
    function(event){

      if(
        event.target === this
      ){

        closeOrder();

      }

    }
  );


/* =========================================================
   ESC CLOSE
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      closeOrder();

    }

  }
);


/* =========================================================
   START
========================================================= */

session();

</script>

</body>
</html>
