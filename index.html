<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<title>MODULAR TECH — نظام إدارة الطلبيات</title>

<style>
:root{
  --bg:#f5f7fb;
  --card:#fff;
  --ink:#111827;
  --muted:#64748b;
  --line:#e5e7eb;
  --primary:#2563eb;
  --green:#16a34a;
  --red:#dc2626;
  --nav:#0b1220;
  --shadow:0 10px 35px rgba(15,23,42,.07);
  --radius:18px
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,"Noto Sans Arabic",sans-serif
}

button,input,textarea,select{
  font:inherit
}

button{
  cursor:pointer;
  border:0
}

.hidden{
  display:none!important
}

/* =========================
   LOGIN
========================= */

#loginPage{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 10%,#2563eb 0,#172554 35%,#070b14 100%)
}

.login-box{
  width:min(430px,100%);
  background:rgba(255,255,255,.98);
  padding:34px;
  border-radius:28px;
  box-shadow:0 30px 80px rgba(0,0,0,.3)
}

.brand{
  text-align:center
}

.brand-mark{
  width:66px;
  height:66px;
  margin:0 auto 14px;
  border-radius:20px;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:900;
  font-size:22px;
  box-shadow:0 12px 28px #2563eb55
}

.brand h1{
  margin:0;
  font-size:27px;
  letter-spacing:.4px
}

.brand p{
  margin:8px 0 25px;
  color:var(--muted);
  font-size:16px
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:12px 0 6px
}

input,textarea,select{
  width:100%;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:var(--ink);
  outline:none;
  transition:.2s
}

input:focus,
textarea:focus,
select:focus{
  border-color:#60a5fa;
  box-shadow:0 0 0 4px #2563eb18
}

.login-btn{
  width:100%;
  padding:15px;
  border-radius:13px;
  background:linear-gradient(135deg,var(--primary),#0ea5e9);
  color:#fff;
  font-weight:800;
  margin-top:10px;
  font-size:17px
}

.login-error{
  display:none;
  background:#fef2f2;
  color:#991b1b;
  border:1px solid #fecaca;
  padding:13px;
  border-radius:12px;
  font-weight:700;
  margin-bottom:12px;
  line-height:1.6
}

/* =========================
   TOP BAR
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(11,18,32,.96);
  backdrop-filter:blur(14px);
  color:#fff;
  padding:12px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px
}

.top-brand{
  display:flex;
  align-items:center;
  gap:10px
}

.mini-mark{
  width:40px;
  height:40px;
  border-radius:12px;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  display:grid;
  place-items:center;
  font-weight:900
}

.top-title{
  font-weight:900
}

.top-sub{
  font-size:11px;
  color:#94a3b8;
  margin-top:2px
}

.top-user{
  display:flex;
  align-items:center;
  gap:10px
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#1e293b;
  display:grid;
  place-items:center;
  font-weight:800
}

.logout{
  background:#ef4444;
  color:#fff;
  border-radius:10px;
  padding:9px 12px;
  font-weight:700
}

/* =========================
   GENERAL
========================= */

.container{
  max-width:1280px;
  margin:auto;
  padding:18px
}

.nav{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:18px;
  padding-bottom:2px
}

.nav button{
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
  background:var(--card);
  color:#334155;
  padding:11px 15px;
  border-radius:12px;
  font-weight:800;
  box-shadow:0 2px 10px #0f172a08
}

.nav button.active{
  background:var(--primary);
  color:#fff;
  box-shadow:0 8px 20px #2563eb33
}

.icon{
  width:19px;
  height:19px;
  display:inline-flex
}

.icon svg{
  width:100%;
  height:100%;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:18px
}

.stat,
.panel,
.order,
.stage-card,
.user-card{
  background:var(--card);
  border:1px solid #edf0f5;
  border-radius:var(--radius);
  box-shadow:var(--shadow)
}

.stat{
  padding:18px;
  position:relative;
  overflow:hidden
}

.stat:after{
  content:"";
  position:absolute;
  left:-25px;
  bottom:-30px;
  width:90px;
  height:90px;
  background:#2563eb12;
  border-radius:50%
}

.stat-title{
  font-size:13px;
  color:var(--muted);
  font-weight:700
}

.stat-number{
  font-size:31px;
  font-weight:900;
  margin-top:8px
}

/* =========================
   PANELS
========================= */

.panel{
  padding:18px;
  margin-bottom:18px
}

.panel-head,
.order-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.panel h2{
  margin:0 0 15px;
  font-size:20px
}

.section-note{
  color:var(--muted);
  font-size:13px;
  margin:-7px 0 15px
}

/* =========================
   BUTTONS
========================= */

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px
}

.btn{
  padding:10px 13px;
  border-radius:11px;
  font-weight:800
}

.primary{
  background:var(--primary);
  color:#fff
}

.success{
  background:var(--green);
  color:#fff
}

.danger{
  background:var(--red);
  color:#fff
}

.secondary{
  background:#eef2f7;
  color:#334155
}

/* =========================
   ORDERS
========================= */

.order-list{
  display:grid;
  gap:12px
}

.order{
  padding:16px
}

.order.urgent{
  border-color:#f59e0b;
  background:linear-gradient(180deg,#fffdf6,#fff)
}

.order-number{
  font-size:18px;
  font-weight:900
}

.customer{
  margin-top:5px;
  font-weight:800
}

.info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:13px
}

.info-box{
  background:#f8fafc;
  border-radius:12px;
  padding:10px;
  font-size:12px;
  color:var(--muted)
}

.info-box b{
  display:block;
  color:var(--ink);
  margin-top:4px;
  font-size:13px
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:6px 10px;
  border-radius:999px;
  background:#eff6ff;
  color:#1d4ed8;
  font-size:12px;
  font-weight:900
}

.badge.overdue{
  background:#fef2f2;
  color:#b91c1c
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted)
}

.muted{
  color:var(--muted);
  font-size:12px
}

.search{
  margin-bottom:14px
}

/* =========================
   MESSAGE
========================= */

.message{
  position:fixed;
  bottom:22px;
  left:20px;
  right:20px;
  margin:auto;
  max-width:520px;
  padding:14px 16px;
  border-radius:13px;
  background:#111827;
  color:#fff;
  text-align:center;
  font-weight:800;
  z-index:100;
  box-shadow:0 12px 30px #0003;
  display:none
}

/* =========================
   MODALS
========================= */

.modal{
  position:fixed;
  inset:0;
  background:#02061799;
  display:grid;
  place-items:center;
  padding:15px;
  z-index:90
}

.modal-box{
  width:min(620px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:22px;
  padding:20px;
  box-shadow:0 30px 80px #0005
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px
}

.modal-head h2{
  margin:0
}

.close{
  background:#eef2f7;
  border-radius:10px;
  padding:7px 12px;
  font-size:20px
}

.check{
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0 12px;
  font-weight:800
}

.check input{
  width:auto;
  margin:0
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.stage-card,
.user-card{
  padding:15px
}

.user-card{
  margin-bottom:10px
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .stats{
    grid-template-columns:repeat(2,1fr)
  }

}

@media(max-width:600px){

  .container{
    padding:12px
  }

  .top-title{
    font-size:14px
  }

  .top-sub{
    display:none
  }

  .top-user .avatar{
    display:none
  }

  .logout{
    padding:8px
  }

  .stats{
    gap:9px
  }

  .stat{
    padding:14px
  }

  .stat-number{
    font-size:25px
  }

  .row{
    grid-template-columns:1fr
  }

  .info{
    grid-template-columns:1fr 1fr
  }

  .panel{
    padding:14px
  }

  .order{
    padding:13px
  }

  .nav button{
    padding:10px 12px
  }

  .login-box{
    padding:25px 20px
  }

}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginPage">

  <div class="login-box">

    <div class="brand">

      <div class="brand-mark">
        MT
      </div>

      <h1>MODULAR TECH</h1>

      <p>نظام إدارة الطلبيات</p>

    </div>

    <div id="loginError" class="login-error"></div>

    <label>اسم المستخدم</label>

    <input
      id="loginUsername"
      autocomplete="username"
      placeholder="أدخل اسم المستخدم"
    >

    <label>كلمة المرور</label>

    <input
      id="loginPassword"
      type="password"
      autocomplete="current-password"
      placeholder="أدخل كلمة المرور"
      onkeydown="if(event.key==='Enter') login()"
    >

    <button
      class="login-btn"
      onclick="login()"
      id="loginButton"
    >
      🔐 تسجيل الدخول
    </button>

  </div>

</div>


<!-- =========================
     APPLICATION
========================= -->

<div id="app" class="hidden">

<header class="topbar">

  <div class="top-brand">

    <div class="mini-mark">
      MT
    </div>

    <div>

      <div class="top-title">
        MODULAR TECH
      </div>

      <div class="top-sub">
        نظام إدارة الطلبيات
      </div>

    </div>

  </div>


  <div class="top-user">

    <div class="avatar" id="avatar">
      م
    </div>

    <span id="currentUser"></span>

    <button
      class="logout"
      onclick="logout()"
    >
      خروج
    </button>

  </div>

</header>


<div class="container">

  <!-- NAV -->

  <div class="nav">

    <button
      class="active"
      onclick="showSection('dashboard',this)"
    >
      <span class="icon">
        <svg viewBox="0 0 24 24">
          <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
        </svg>
      </span>
      الرئيسية
    </button>


    <button
      onclick="showSection('ordersSection',this)"
    >
      <span class="icon">
        <svg viewBox="0 0 24 24">
          <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
        </svg>
      </span>
      الطلبيات
    </button>


    <button
      onclick="showSection('production',this)"
    >
      <span class="icon">
        <svg viewBox="0 0 24 24">
          <path d="M3 21V9l6 3V7l6 3V5l6 3v13z"/>
          <path d="M7 21v-4h3v4m4 0v-4h3v4"/>
        </svg>
      </span>
      مراحل العمل
    </button>


    <button
      id="usersNav"
      onclick="showSection('users',this)"
    >
      <span class="icon">
        <svg viewBox="0 0 24 24">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>
          <path d="M16 5a4 4 0 0 1 0 8m4 8v-2a4 4 0 0 0-3-3.87"/>
        </svg>
      </span>
      المستخدمون
    </button>

  </div>


  <!-- DASHBOARD -->

  <section id="dashboard">

    <div class="stats">

      <div class="stat">
        <div class="stat-title">
          إجمالي الطلبيات
        </div>

        <div
          class="stat-number"
          id="totalCount"
        >
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          قيد العمل
        </div>

        <div
          class="stat-number"
          id="activeCount"
        >
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          مهمة جدًا
        </div>

        <div
          class="stat-number"
          id="urgentCount"
        >
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          متأخرة
        </div>

        <div
          class="stat-number"
          id="overdueCount"
        >
          0
        </div>
      </div>

    </div>


    <div class="panel">

      <div class="panel-head">

        <h2>
          آخر الطلبيات
        </h2>

        <button
          class="btn primary admin-only"
          onclick="openAddModal()"
        >
          + إضافة طلبية
        </button>

      </div>

      <div id="latestOrders"></div>

    </div>

  </section>


  <!-- ORDERS -->

  <section
    id="ordersSection"
    class="hidden"
  >

    <div class="panel">

      <div class="panel-head">

        <h2>
          إدارة الطلبيات
        </h2>

        <button
          class="btn primary admin-only"
          onclick="openAddModal()"
        >
          + إضافة طلبية
        </button>

      </div>


      <input
        class="search"
        id="search"
        type="search"
        placeholder="ابحث برقم الطلبية أو اسم الزبون أو الهاتف"
        oninput="renderOrders()"
      >

      <div
        id="ordersList"
        class="order-list"
      ></div>

    </div>

  </section>


  <!-- PRODUCTION -->

  <section
    id="production"
    class="hidden"
  >

    <div class="panel">

      <h2>
        مراحل العمل
      </h2>

      <p class="section-note">
        متابعة سير كل طلبية والقسم المسؤول عنها.
      </p>

      <div
        id="stageList"
        class="order-list"
      ></div>

    </div>

  </section>


  <!-- USERS -->

  <section
    id="users"
    class="hidden"
  >

    <div class="panel">

      <div class="panel-head">

        <h2>
          المستخدمون
        </h2>

        <button
          class="btn primary"
          onclick="openUserModal()"
        >
          + إضافة مستخدم
        </button>

      </div>

      <p class="section-note">
        إدارة ملفات المستخدمين.
      </p>

      <div id="usersList"></div>

    </div>

  </section>

</div>

</div>


<!-- =========================
     MESSAGE
========================= -->

<div
  id="message"
  class="message"
></div>


<!-- =========================
     ORDER MODAL
========================= -->

<div
  id="orderModal"
  class="modal hidden"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        إضافة طلبية
      </h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <form id="orderForm">

      <input
        type="hidden"
        id="editId"
      >


      <label>
        رقم الطلبية
      </label>

      <input
        id="orderNum"
        required
        placeholder="مثال: 10025"
      >


      <label>
        اسم الزبون
      </label>

      <input
        id="customer"
        required
        placeholder="اسم الزبون"
      >


      <div class="row">

        <div>

          <label>
            رقم الهاتف
          </label>

          <input
            id="phone"
            type="tel"
            placeholder="05xxxxxxxx"
          >

        </div>


        <div>

          <label>
            موعد التسليم
          </label>

          <input
            id="due"
            type="date"
            required
          >

        </div>

      </div>


      <label>
        ملاحظات
      </label>

      <textarea
        id="notes"
        rows="4"
        placeholder="اكتب الملاحظات"
      ></textarea>


      <label class="check">

        <input
          type="checkbox"
          id="urgent"
        >

        طلبية مهمة جدًا ⭐

      </label>


      <div class="actions">

        <button
          type="submit"
          class="btn primary"
        >
          حفظ الطلبية
        </button>

        <button
          type="button"
          class="btn secondary"
          onclick="closeModal()"
        >
          إلغاء
        </button>

      </div>

    </form>

  </div>

</div>


<!-- =========================
     USER MODAL
========================= -->

<div
  id="userModal"
  class="modal hidden"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        إضافة مستخدم
      </h2>

      <button
        class="close"
        onclick="closeUserModal()"
      >
        ×
      </button>

    </div>


    <form id="userForm">

      <label>
        اسم المستخدم
      </label>

      <input
        id="newUsername"
        required
      >


      <label>
        الاسم الكامل
      </label>

      <input
        id="newFullName"
        required
      >


      <label>
        البريد الإلكتروني
      </label>

      <input
        id="newEmail"
        type="email"
        required
      >


      <label>
        كلمة المرور
      </label>

      <input
        id="newPassword"
        type="password"
        minlength="6"
        required
      >


      <label>
        القسم
      </label>

      <select id="newRole">

        <option value="المدير">
          المدير
        </option>

        <option value="القص">
          القص
        </option>

        <option value="الكنت">
          الكنت
        </option>

        <option value="CNC">
          CNC
        </option>

        <option value="التركيب">
          التركيب
        </option>

        <option value="الدهان">
          الدهان
        </option>

        <option value="التغليف">
          التغليف
        </option>

        <option value="التحميل">
          التحميل
        </option>

        <option value="التسليم">
          التسليم
        </option>

      </select>


      <label class="check">

        <input
          type="checkbox"
          id="newActive"
          checked
        >

        الحساب فعال

      </label>


      <div class="actions">

        <button
          type="submit"
          class="btn primary"
        >
          إنشاء المستخدم
        </button>

        <button
          type="button"
          class="btn secondary"
          onclick="closeUserModal()"
        >
          إلغاء
        </button>

      </div>

    </form>

  </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =

const SUPABASE_KEY =

/* =========================================
   GLOBAL VARIABLES
========================================= */

let orders = [];

let currentProfile = null;

let role = "";


/* =========================================
   PRODUCTION STAGES
========================================= */

const stages = [

  ["في العمل","المدير"],

  ["تم القص","القص"],

  ["تم الكنت","الكنت"],

  ["تم CNC","CNC"],

  ["تم التركيب","التركيب"],

  ["تم الدهان","الدهان"],

  ["تم التغليف","التغليف"],

  ["تم التحميل","التحميل"],

  ["تم التسليم","التسليم"]

];


/* =========================================
   ICONS
========================================= */

function icon(name){

  const icons = {

    edit:
      '<path d="M12 20h9"/>' +
      '<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/>',

    trash:
      '<path d="M3 6h18"/>' +
      '<path d="M8 6V4h8v2"/>' +
      '<path d="m7 6 1 15h8l1-15"/>' +
      '<path d="M10 11v6m4-6v6"/>',

    arrow:
      '<path d="M5 12h14"/>' +
      '<path d="m13 6 6 6-6 6"/>'

  };

  return `
    <svg viewBox="0 0 24 24">
      ${icons[name] || ""}
    </svg>
  `;
}


/* =========================================
   SUPABASE REQUEST
========================================= */

async function request(
  path,
  method = "GET",
  body = null
){

  const access =
    localStorage.getItem("supabase_access_token");

  const token =
    access || SUPABASE_KEY;

  const options = {

    method,

    headers:{

      apikey:SUPABASE_KEY,

      Authorization:"Bearer " + token,

      "Content-Type":"application/json",

      Prefer:"return=representation"

    }

  };

  if(body !== null){

    options.body =
      JSON.stringify(body);

  }

  const response =
    await fetch(
      SUPABASE_URL + path,
      options
    );

  const text =
    await response.text();

  let data;

  try{

    data =
      text
      ? JSON.parse(text)
      : null;

  }catch{

    data = text;

  }

  if(!response.ok){

    throw new Error(

      typeof data === "object"

      ? (
          data.message ||
          data.error_description ||
          data.error ||
          data.hint ||
          JSON.stringify(data)
        )

      : data || ("HTTP " + response.status)

    );

  }

  return data;

}


/* =========================================
   SUPABASE AUTH
========================================= */

async function auth(path,body){

  const response =
    await fetch(

      SUPABASE_URL +
      "/auth/v1/" +
      path,

      {

        method:"POST",

        headers:{

          apikey:SUPABASE_KEY,

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify(body)

      }

    );


  const text =
    await response.text();

  let data;

  try{

    data =
      text
      ? JSON.parse(text)
      : {};

  }catch{

    data = {
      message:text
    };

  }


  if(!response.ok){

    throw new Error(

      data.error_description ||
      data.msg ||
      data.message ||
      "فشل تسجيل الدخول"

    );

  }


  return data;

}


/* =========================================
   MESSAGE
========================================= */

function msg(text){

  const box =

  box.textContent = text;

  box.style.display = "block";

  window.msgTimer =

    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,

      char => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[char])

    );

}


/* =========================================
   LOGIN
========================================= */

async function login(){

  const username =
    document
      .getElementById("loginUsername")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const error =
    document
      .getElementById("loginError");

  const button =
    document
      .getElementById("loginButton");


  error.style.display = "none";


  if(!username || !password){

    error.textContent =
      "يرجى إدخال اسم المستخدم وكلمة المرور";

    error.style.display = "block";

    return;

  }


  button.disabled = true;

  button.textContent =
    "جاري تسجيل الدخول...";


  try{

    /*
      أولاً:
      نحصل على البريد الإلكتروني
      المرتبط باسم المستخدم
    */

    const result =
      await request(

        "/rest/v1/rpc/get_login_email",

        "POST",

        {
          p_username:username
        }

      );


    let email = "";


    if(Array.isArray(result)){

      const first =
        result[0];

      if(typeof first === "string"){

        email = first;

      }else{

        email =
          first?.email ||
          first?.get_login_email ||
          Object.values(first || {})[0] ||
          "";

      }

    }

    else if(typeof result === "string"){

      email = result;

    }

    else if(result){

      email =
        result.email ||
        result.get_login_email ||
        Object.values(result)[0] ||
        "";

    }


    email =
      String(email || "")
      .trim();


    if(!email){

      throw new Error(
        "اسم المستخدم غير موجود أو الحساب غير فعال"
      );

    }


    /*
      تسجيل الدخول في Supabase Auth
    */

    const session =
      await auth(

        "token?grant_type=password",

        {
          email:email,
          password:password
        }

      );


    if(!session.access_token){

      throw new Error(
        "لم يتم الحصول على جلسة تسجيل الدخول"
      );

    }


    localStorage.setItem(
      "supabase_access_token",
      session.access_token
    );


    if(session.refresh_token){

      localStorage.setItem(
        "supabase_refresh_token",
        session.refresh_token
      );

    }


    /*
      تحميل ملف المستخدم.
      هنا تم إصلاح المشكلة الموجودة
      في الكود القديم:
      البحث لا يعتمد على ID فقط.
    */

    await loadProfile(

      session.user?.id || "",

      session.user?.email || email,

      username

    );


    showApp();

    await loadOrders();

    msg("✅ تم تسجيل الدخول بنجاح");


  }catch(errorObject){

    console.error(
      "LOGIN ERROR:",
      errorObject
    );


    error.textContent =
      "❌ " +
      (
        errorObject?.message ||
        "حدث خطأ أثناء تسجيل الدخول"
      );


    error.style.display =
      "block";


    localStorage.removeItem(
      "supabase_access_token"
    );

    localStorage.removeItem(
      "supabase_refresh_token"
    );


  }finally{

    button.disabled = false;

    button.textContent =
      "🔐 تسجيل الدخول";

  }

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(
  userId,
  email = "",
  username = ""
){

  currentProfile = null;


  /*
    المحاولة الأولى:
    Auth User ID
  */

  if(userId){

    try{

      const data =
        await request(

          "/rest/v1/profiles" +
          "?select=id,username,full_name,role,active,email" +
          "&id=eq." +
          encodeURIComponent(userId) +
          "&limit=1"

        );


      if(
        Array.isArray(data) &&
        data.length > 0
      ){

        currentProfile =
          data[0];

      }

    }catch(error){

      console.warn(
        "Profile by ID failed:",
        error
      );

    }

  }


  /*
    المحاولة الثانية:
    البريد الإلكتروني
  */

  if(!currentProfile && email){

    try{

      const data =
        await request(

          "/rest/v1/profiles" +
          "?select=id,username,full_name,role,active,email" +
          "&email=eq." +
          encodeURIComponent(email) +
          "&limit=1"

        );


      if(
        Array.isArray(data) &&
        data.length > 0
      ){

        currentProfile =
          data[0];

      }

    }catch(error){

      console.warn(
        "Profile by email failed:",
        error
      );

    }

  }


  /*
    المحاولة الثالثة:
    اسم المستخدم
  */

  if(!currentProfile && username){

    try{

      const data =
        await request(

          "/rest/v1/profiles" +
          "?select=id,username,full_name,role,active,email" +
          "&username=eq." +
          encodeURIComponent(username) +
          "&limit=1"

        );


      if(
        Array.isArray(data) &&
        data.length > 0
      ){

        currentProfile =
          data[0];

      }

    }catch(error){

      console.warn(
        "Profile by username failed:",
        error
      );

    }

  }


  /*
    إذا لم نجد المستخدم
  */

  if(!currentProfile){

    throw new Error(
      "لم يتم العثور على ملف المستخدم في جدول profiles"
    );

  }


  /*
    التحقق من حالة الحساب
  */

  if(currentProfile.active === false){

    throw new Error(
      "هذا الحساب غير فعال"
    );

  }


  role =
    currentProfile.role || "";


  const displayName =
    currentProfile.full_name ||
    currentProfile.username ||
    "المستخدم";


  document
    .getElementById("currentUser")
    .textContent =
      displayName +
      " — " +
      role;


  document
    .getElementById("avatar")
    .textContent =
      displayName
        .trim()
        .charAt(0) || "م";

}

/* =========================================
   NORMALIZE ORDER
========================================= */

function norm(order){

  return {

    id:order.id,

    num:
      order.order_number || "",

    customer:
      order.customer_name || "",

    phone:
      order.phone || "",

    due:
      order.due_date || "",

    notes:
      order.notes || "",

    urgent:
      !!order.urgent,

    stage:
      Number(order.stage || 0)

  };

}


/* =========================================
   OVERDUE
========================================= */

function overdue(order){

  return (

    order.due &&

    new Date(
      order.due + "T23:59:59"
    ) < new Date() &&

    order.stage <
    stages.length - 1

  );

}

/* =========================================
   NEXT STAGE
========================================= */

async function nextStage(id){

  const order =
    orders
      .map(norm)
      .find(
        x =>
          String(x.id) ===
          String(id)
      );


  if(!order){

    return;

  }


  const next =
    order.stage + 1;


  if(next >= stages.length){

    return;

  }


  /*
    المدير يستطيع الانتقال
    في جميع المراحل.

    باقي الأقسام:
    يستطيع القسم تغيير المرحلة
    عندما تكون المرحلة التالية
    تابعة له.
  */

  if(
    role !== "المدير" &&
    stages[next][1] !== role
  ){

    alert(
      "هذه المرحلة ليست ضمن صلاحيات قسمك"
    );

    return;

  }


  try{

    await request(

      "/rest/v1/orders?id=eq." +
      encodeURIComponent(id),

      "PATCH",

      {
        stage:next,

        updated_at:
          new Date().toISOString()
      }

    );


    await loadOrders();

    msg(
      "✅ تم تحديث المرحلة إلى: " +
      stages[next][0]
    );


  }catch(error){

    alert(
      "❌ فشل تحديث المرحلة\n\n" +
      error.message
    );

  }

}

            order.num,
            order.customer,
            order.phone
          ]
          .join(" ")
          .toLowerCase()
          .includes(query)
      );


  document
    .getElementById("ordersList")
    .innerHTML =

      list
        .map(orderHtml)
        .join("") ||

      '<div class="empty">لا توجد طلبيات مطابقة</div>';

}


/* =========================================
   PRODUCTION STAGES
========================================= */

function renderStages(){

  const list =
    orders.map(norm);


  document
    .getElementById("stageList")
    .innerHTML =

      stages
        .map(
          (stage,index)=>{

            const stageOrders =
              list.filter(
                order =>
                  order.stage ===
                  index
              );


            return `

              <div class="stage-card">

                <div class="order-head">

                  <div>

                    <div class="order-number">

                      ${stage[0]}

                    </div>

                    <div class="muted">

                      القسم المسؤول:
                      ${stage[1]}

                    </div>

                  </div>


                  <span class="badge">

                    ${stageOrders.length}
                    طلبية

                  </span>

                </div>


                <div style="margin-top:12px">

                  ${
                    stageOrders
                      .map(orderHtml)
                      .join("")

                    ||

                    '<div class="empty">لا توجد طلبيات في هذه المرحلة</div>'
                  }

                </div>

              </div>

            `;

          }
        )
        .join("");

}


/* =========================================
   USERS
========================================= */

async function loadUsers(){

  if(role !== "المدير"){

    return;

  }


  try{

    const users =
      await request(

        "/rest/v1/profiles" +
        "?select=id,username,full_name,role,active,email" +
        "&order=created_at.desc"

      );


    document
      .getElementById("usersList")
      .innerHTML =

      (users || [])
        .map(
          user => `

            <div class="user-card">

              <div class="order-head">

                <div>

                  <div class="order-number">

                    ${
                      esc(
                        user.full_name ||
                        user.username
                      )
                    }

                  </div>

                  <div class="muted">

                    @${esc(user.username)}

                  </div>

                </div>


                <span class="badge">

                  ${esc(user.role)}

                </span>

              </div>


              <div class="info">

                <div class="info-box">

                  الحساب

                  <b>

                    ${
                      user.active
                      ? "فعال"
                      : "متوقف"
                    }

                  </b>

                </div>


                <div class="info-box">

                  القسم

                  <b>

                    ${esc(user.role)}

                  </b>

                </div>


                <div class="info-box">

                  البريد

                  <b>

                    ${esc(user.email || "-")}

                  </b>

                </div>

              </div>

            </div>

          `
        )
        .join("") ||

      '<div class="empty">لا يوجد مستخدمون</div>';


  }catch(error){

    document
      .getElementById("usersList")
      .innerHTML =

      `<div class="empty">

        ❌ تعذر تحميل المستخدمين

        <br>

        <small>
          ${esc(error.message)}
        </small>

      </div>`;

  }

}


/* =========================================
   USER MODAL
========================================= */

function openUserModal(){

  if(role !== "المدير"){

    alert(
      "هذه الصفحة للمدير فقط"
    );

    return;

  }


  document
    .getElementById("userForm")
    .reset();


  document
    .getElementById("newActive")
    .checked = true;


  document
    .getElementById("userModal")
    .classList
    .remove("hidden");

}


function closeUserModal(){

  document
    .getElementById("userModal")
    .classList
    .add("hidden");

}

document

function renderAll(){
