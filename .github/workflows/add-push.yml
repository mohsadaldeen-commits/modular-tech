name: Enable MODULAR TECH Push Notifications
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  setup-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install push notification code
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = "MODULAR-TECH-PUSH-V3"
          if marker in text:
              print("Push code already installed")
              raise SystemExit(0)
          code = r'''
          <!-- MODULAR-TECH-PUSH-V3 -->
          <script>
          (() => {
            const VAPID_PUBLIC_KEY =
              "BFmcCH6Ftbr3eO7b2UWsTVE0rVxM2yD1nAApIaMVGQBFl8-h4-J5fJ-kA0M27kSi2WveG8C-xjxt1LDbDDT82oU";
            const SUPABASE_URL =
              "https://bvrfrcmblwzuqprjknam.supabase.co";
            const SUPABASE_KEY =
              "sb_publishable_vVXVJGcWpoPvPEH_bfm23Q_dZ5eXvmE";
            function urlBase64ToUint8Array(base64String) {
              const padding =
                "=".repeat((4 - base64String.length % 4) % 4);
              const base64 =
                (base64String + padding)
                  .replace(/-/g, "+")
                  .replace(/_/g, "/");
              const rawData = atob(base64);
              return Uint8Array.from(
                [...rawData].map(char =>
                  char.charCodeAt(0)
                )
              );
            }
            async function enablePushNotifications() {
              if (
                !window.isSecureContext ||
                !("serviceWorker" in navigator) ||
                !("PushManager" in window) ||
                !("Notification" in window)
              ) {
                alert(
                  "هذا الجهاز أو المتصفح لا يدعم إشعارات التطبيق من هنا."
                );
                return;
              }
              try {
                const permission =
                  await Notification.requestPermission();
                if (permission !== "granted") {
                  alert(
                    "يجب السماح بالإشعارات حتى تعمل إشعارات التطبيق."
                  );
                  return;
                }
                const registration =
                  await navigator.serviceWorker.ready;
                let subscription =
                  await registration.pushManager.getSubscription();
                if (!subscription) {
                  subscription =
                    await registration.pushManager.subscribe({
                      userVisibleOnly: true,
                      applicationServerKey:
                        urlBase64ToUint8Array(
                          VAPID_PUBLIC_KEY
                        )
                    });
                }
                const token =
                  localStorage.getItem(
                    "supabase_access_token"
                  );
                if (!token) {
                  alert(
                    "يجب تسجيل الدخول إلى التطبيق أولاً، ثم تفعيل الإشعارات."
                  );
                  return;
                }
                const userResponse =
                  await fetch(
                    SUPABASE_URL + "/auth/v1/user",
                    {
                      headers: {
                        apikey:
                          SUPABASE_KEY,
                        Authorization:
                          "Bearer " + token
                      }
                    }
                  );
                if (!userResponse.ok) {
                  throw new Error(
                    "تعذر التحقق من المستخدم"
                  );
                }
                const user =
                  await userResponse.json();
                const saveResponse =
                  await fetch(
                    SUPABASE_URL +
                    "/rest/v1/push_subscriptions?on_conflict=endpoint",
                    {
                      method: "POST",
                      headers: {
                        apikey:
                          SUPABASE_KEY,
                        Authorization:
                          "Bearer " + token,
                        "Content-Type":
                          "application/json",
                        Prefer:
                          "resolution=merge-duplicates,return=minimal"
                      },
                      body:
                        JSON.stringify({
                          user_id:
                            user.id,
                          endpoint:
                            subscription.endpoint,
                          subscription:
                            subscription.toJSON()
                        })
                    }
                  );
                if (!saveResponse.ok) {
                  const errorText =
                    await saveResponse.text();
                  throw new Error(
                    errorText ||
                    "تعذر حفظ الاشتراك"
                  );
                }
                alert(
                  "تم تفعيل إشعارات MODULAR TECH بنجاح 🔔"
                );
                const button =
                  document.getElementById(
                    "modularPushButton"
                  );
                if (button) {
                  button.textContent =
                    "🔔 الإشعارات مفعّلة";
                  button.disabled = true;
                }
              }
              catch (error) {
                console.error(
                  "Push setup error:",
                  error
                );
                alert(
                  "تعذر تفعيل الإشعارات. تأكد من السماح بالإشعارات ومن تسجيل الدخول."
                );
              }
            }
            function addPushButton() {
              if (
                document.getElementById(
                  "modularPushButton"
                )
              ) {
                return;
              }
              const button =
                document.createElement("button");
              button.id =
                "modularPushButton";
              button.type =
                "button";
              button.textContent =
                "🔔 تفعيل إشعارات التطبيق";
              button.style.cssText =
                "position:fixed;bottom:20px;left:20px;z-index:99999;padding:12px 16px;border:0;border-radius:12px;background:#0b1220;color:#fff;font-size:14px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer";
              button.addEventListener(
                "click",
                enablePushNotifications
              );
              document.body.appendChild(
                button
              );
            }
            if (
              document.readyState ===
              "loading"
            ) {
              document.addEventListener(
                "DOMContentLoaded",
                addPushButton
              );
            }
            else {
              addPushButton();
            }
          })();
          </script>
          <!-- END MODULAR-TECH-PUSH-V3 -->
          '''
          if "</body>" not in text:
              raise SystemExit(
                "ERROR: </body> was not found"
              )
          text =
            text.replace(
              "</body>",
              code + "\n</body>",
              1
            )
          path.write_text(
            text,
            encoding="utf-8"
          )
          print(
            "Push code installed successfully"
          )
          PY
      - name: Commit changes
        run: |
          git config user.name \
            "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit \
            -m "Enable push notification subscription"
          git push
