name: Enable MODULAR TECH Push Notifications

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install push code
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          marker = "MODULAR-TECH-PUSH-V2"

          if marker in text:
              print("Push code already installed.")
              raise SystemExit(0)

          code = """
          <!-- MODULAR-TECH-PUSH-V2 -->
          <script>
          (function () {

            const SUPABASE_URL =
              "https://bvrfrcmblwzuqprjknam.supabase.co";

            const SUPABASE_KEY =
              "sb_publishable_vVXVJGcWpoPvPEH_bfm23Q_dZ5eXvmE";

            const VAPID_PUBLIC_KEY =
              "BFmcCH6Ftbr3eO7b2UWsTVE0rVxM2yD1nAApIaMVGQBFl8-h4-J5fJ-kA0M27kSi2WveG8C-xjxt1LDbDDT82oU";

            async function enablePush() {

              try {

                if (!("serviceWorker" in navigator)) {
                  console.log("Service Worker not supported");
                  return;
                }

                if (!("PushManager" in window)) {
                  console.log("Push not supported");
                  return;
                }

                if (!("Notification" in window)) {
                  console.log("Notifications not supported");
                  return;
                }

                const permission =
                  await Notification.requestPermission();

                if (permission !== "granted") {
                  console.log("Notification permission denied");
                  return;
                }

                const registration =
                  await navigator.serviceWorker.ready;

                let subscription =
                  await registration.pushManager.getSubscription();

                if (!subscription) {

                  const padding =
                    "=".repeat(
                      (4 - VAPID_PUBLIC_KEY.length % 4) % 4
                    );

                  const base64 =
                    (VAPID_PUBLIC_KEY + padding)
                      .replace(/-/g, "+")
                      .replace(/_/g, "/");

                  const raw =
                    atob(base64);

                  const key =
                    Uint8Array.from(
                      Array.from(raw).map(
                        function (c) {
                          return c.charCodeAt(0);
                        }
                      )
                    );

                  subscription =
                    await registration.pushManager.subscribe({
                      userVisibleOnly: true,
                      applicationServerKey: key
                    });
                }

                let accessToken =
                  localStorage.getItem(
                    "supabase_access_token"
                  );

                if (!accessToken) {

                  const keys =
                    Object.keys(localStorage);

                  for (const key of keys) {

                    if (
                      key.includes(
                        "bvrfrcmblwzuqprjknam"
                      )
                    ) {

                      try {

                        const value =
                          JSON.parse(
                            localStorage.getItem(key)
                          );

                        if (value && value.access_token) {
                          accessToken =
                            value.access_token;
                          break;
                        }

                      } catch (e) {}

                    }

                  }

                }

                if (!accessToken) {
                  console.log(
                    "No Supabase access token found"
                  );
                  return;
                }

                const userResponse =
                  await fetch(
                    SUPABASE_URL +
                    "/auth/v1/user",
                    {
                      headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                          "Bearer " + accessToken
                      }
                    }
                  );

                if (!userResponse.ok) {
                  console.log(
                    "Could not identify Supabase user"
                  );
                  return;
                }

                const user =
                  await userResponse.json();

                if (!user || !user.id) {
                  console.log("User ID not found");
                  return;
                }

                const saveResponse =
                  await fetch(
                    SUPABASE_URL +
                    "/rest/v1/push_subscriptions",
                    {
                      method: "POST",

                      headers: {
                        "apikey": SUPABASE_KEY,

                        "Authorization":
                          "Bearer " + accessToken,

                        "Content-Type":
                          "application/json",

                        "Prefer":
                          "return=minimal"
                      },

                      body: JSON.stringify({
                        user_id: user.id,
                        endpoint: subscription.endpoint,
                        subscription:
                          subscription.toJSON()
                      })
                    }
                  );

                if (
                  saveResponse.ok ||
                  saveResponse.status === 409
                ) {

                  console.log(
                    "MODULAR TECH push notifications enabled"
                  );

                } else {

                  console.log(
                    "Could not save push subscription",
                    await saveResponse.text()
                  );

                }

              } catch (error) {

                console.error(
                  "Push notification error:",
                  error
                );

              }

            }

            let started = false;

            function startPush() {

              if (started) return;

              started = true;

              enablePush();

            }

            window.addEventListener(
              "click",
              startPush,
              { once: true }
            );

            window.addEventListener(
              "touchstart",
              startPush,
              { once: true }
            );

          })();
          </script>
          """

          if "</body>" not in text:
              raise SystemExit(
                  "ERROR: </body> was not found"
              )

          text = text.replace(
              "</body>",
              code + "\n</body>",
              1
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("Push code installed successfully.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Enable push notification subscription"
          git push
